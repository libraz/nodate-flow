# Packages `ncu -u` must not raise, and why. Drop an entry once its blocker is
# gone so the next run picks the package up again.
#
# A reject only stops ncu from rewriting the range; it does not stop semver
# resolution. Anything held back below a published minor is pinned exactly in
# the package.json that declares it.
reject:
  # v9.3.1 (latest, re-measured 2026-11-20) rewrites the table API around
  # feature maps and createCoreRowModel; the existing primitive and its views
  # need a coordinated rewrite (100+ type errors across flow-web and data-grid).
  # Keep this on v8 until that UI migration is done.
  - "@tanstack/react-table"

  # 1.4.2 renders an option's value placeholder from the camelCase destination
  # instead of the flag name. v2.0.0 (latest, 2026-11-20) is a breaking API
  # rewrite: it removes `c` and table `headerLabels`, requires argv arrays for
  # exec(), and changes help output. Trial produced 7 TS errors and 32 test
  # failures; upgrading requires a coordinated CLI rewrite.
  - "@libraz/node-cli"

  # An alias for the TypeScript copy the SDK generator runs on. openapi-typescript
  # emits its output through `ts.factory`, which only the JavaScript implementation
  # of the compiler exposes, so this edge has to stay on a 5.x release even as the
  # workspaces move their own `typescript` forward.
  - "typescript-5x"

packageManager: bun
