version: "2"
sql:
  - engine: "mysql"
    queries:
      - "queries/admin"
      - "queries/ai"
      - "queries/ai-embeddings"
      - "queries/ai-settings"
      - "queries/attachments"
      - "queries/audit"
      - "queries/auth"
      - "queries/auto-action-rules"
      - "queries/comments"
      - "queries/dashboard"
      - "queries/events"
      - "queries/favorites"
      - "queries/imports"
      - "queries/inbox"
      - "queries/intake"
      - "queries/integrations"
      - "queries/labels"
      - "queries/lenses"
      - "queries/mcp"
      - "queries/mentions"
      - "queries/notification-preferences"
      - "queries/notifications"
      - "queries/pages"
      - "queries/projects"
      - "queries/reactions"
      - "queries/recent-visits"
      - "queries/relation_suggestions"
      - "queries/repo_mappings"
      - "queries/signals"
      - "queries/task-event-links"
      - "queries/tasks"
      - "queries/timeboxes"
      - "queries/view-preferences"
      - "queries/webhooks"
      - "queries/workspaces"
    schema:
      - "tables"
      - "views"
    gen:
      go:
        package: "generated"
        out: "../apps/flow-api/internal/db/generated"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: "camel"
        emit_pointers_for_null_types: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          # public_id is the only externally visible identifier (UUID v7, BINARY(16)).
          - column: "*.public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.user_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          # event_public_id is BINARY(16) on webhook_deliveries (the source events.public_id
          # used as the dedupe anchor). Without this override sqlc maps the nullable column
          # to sql.NullString, which writes the canonical 36-char UUID into the BINARY(16)
          # column truncated to 16 bytes — a silent data corruption that broke webhook
          # dedupe (H1 audit). Mapping it to *PublicID routes through the type's binary
          # Valuer/Scanner, and the pointer preserves NULL semantics so manual test
          # deliveries (no source event) do not collide on the (subscription_id,
          # event_public_id) unique key.
          - column: "*.event_public_id"
            nullable: true
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
              pointer: true
          # Internal surrogate keys must never leak to JSON responses.
          - column: "*.id"
            go_struct_tag: 'json:"-"'
          - column: "*.workspace_id"
            go_struct_tag: 'json:"-"'
          - column: "*.user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.project_id"
            go_struct_tag: 'json:"-"'
          - column: "*.task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.parent_task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.actor_id"
            go_struct_tag: 'json:"-"'
          - column: "*.provider_id"
            go_struct_tag: 'json:"-"'
          - column: "*.recipient_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.actor_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.subscription_id"
            go_struct_tag: 'json:"-"'
          - column: "*.creator_id"
            go_struct_tag: 'json:"-"'
          - column: "*.timebox_id"
            go_struct_tag: 'json:"-"'
          - column: "*.source_task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.target_task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.resolved_by"
            go_struct_tag: 'json:"-"'
          - column: "*.parent_page_id"
            go_struct_tag: 'json:"-"'
          - column: "*.label_id"
            go_struct_tag: 'json:"-"'
          - column: "*.parent_label_id"
            go_struct_tag: 'json:"-"'
          - column: "*.task_internal_id"
            go_struct_tag: 'json:"-"'
          - column: "*.comment_id"
            go_struct_tag: 'json:"-"'
          - column: "*.mentioned_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.target_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.entity_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.scope_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.mentioned_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.actor_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.calendar_id"
            go_struct_tag: 'json:"-"'
          - column: "*.event_id"
            go_struct_tag: 'json:"-"'
          - column: "*.attendee_id"
            go_struct_tag: 'json:"-"'
          - column: "*.owner_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.created_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.updated_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.author_id"
            go_struct_tag: 'json:"-"'
          - column: "*.uploader_id"
            go_struct_tag: 'json:"-"'
          - column: "*.target_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.calendar_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.resource_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.target_resource_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.signal_id"
            go_struct_tag: 'json:"-"'
          - column: "*.triaged_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.author_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.triaged_by_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.author_public_id"
            go_type:
              import: "github.com/nodate-flow/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.initiated_by_user_id"
            go_struct_tag: 'json:"-"'
  # --- flow-api calendar subpackage (calendar queries only) ---
