version: "2"
sql:
  - engine: "mysql"
    queries:
      - "queries/admin"
      - "queries/agents"
      - "queries/ai"
      - "queries/ai-embeddings"
      - "queries/ai-settings"
      - "queries/attachments"
      - "queries/audit"
      - "queries/auth"
      - "queries/auto-action-rules"
      - "queries/comments"
      - "queries/dashboard"
      - "queries/events"
      - "queries/favorites"
      - "queries/imports"
      - "queries/inbox"
      - "queries/intake"
      - "queries/integration_mappings"
      - "queries/integrations"
      - "queries/labels"
      - "queries/lenses"
      - "queries/mcp"
      - "queries/mentions"
      - "queries/notification-preferences"
      - "queries/notifications"
      - "queries/pages"
      - "queries/projects"
      - "queries/reactions"
      - "queries/recent-visits"
      - "queries/relation_suggestions"
      - "queries/signals"
      - "queries/storage-objects"
      - "queries/task-event-links"
      - "queries/tasks"
      - "queries/timeboxes"
      - "queries/view-preferences"
      - "queries/webhooks"
      - "queries/workspaces"
    schema:
      - "core/tables"
      - "flow/tables"
      - "flow/constraints"
      - "flow/views"
    gen:
      go:
        package: "generated"
        out: "../apps/flow-api/internal/db/generated"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: "camel"
        emit_pointers_for_null_types: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          # public_id is the only externally visible identifier (UUID v7, BINARY(16)).
          - column: "*.public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.user_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          # event_public_id is BINARY(16) on webhook_deliveries (the source events.public_id
          # used as the dedupe anchor). Without this override sqlc maps the nullable column
          # to sql.NullString, which writes the canonical 36-char UUID into the BINARY(16)
          # column truncated to 16 bytes — a silent data corruption that broke webhook
          # dedupe (H1 audit). Mapping it to *PublicID routes through the type's binary
          # Valuer/Scanner, and the pointer preserves NULL semantics so manual test
          # deliveries (no source event) do not collide on the (subscription_id,
          # event_public_id) unique key.
          - column: "*.event_public_id"
            nullable: true
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
              pointer: true
          # Internal surrogate keys must never leak to JSON responses.
          - column: "*.id"
            go_struct_tag: 'json:"-"'
          - column: "*.workspace_id"
            go_struct_tag: 'json:"-"'
          - column: "*.user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.project_id"
            go_struct_tag: 'json:"-"'
          - column: "*.task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.parent_task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.actor_id"
            go_struct_tag: 'json:"-"'
          - column: "*.provider_id"
            go_struct_tag: 'json:"-"'
          # Internal FKs whose target is itself a public_id-bearing table:
          # ai_agents, ai_models, tasks (both ends of a relation),
          # public_shares, calendar_events (the recurrence master). Each
          # of these is an integer surrogate key and none of them has a
          # public alias in the same row, so leaving the tag off publishes
          # the sequence directly. TestGeneratedIDFieldsAreNotSerialized
          # in internal/db is what keeps this list from falling behind the
          # schema again.
          - column: "*.agent_id"
            go_struct_tag: 'json:"-"'
          - column: "*.actor_agent_id"
            go_struct_tag: 'json:"-"'
          - column: "*.model_id"
            go_struct_tag: 'json:"-"'
          - column: "*.from_task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.to_task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.share_id"
            go_struct_tag: 'json:"-"'
          - column: "*.recurrence_parent_id"
            go_struct_tag: 'json:"-"'
          - column: "*.modified_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.target_workspace_id"
            go_struct_tag: 'json:"-"'
          - column: "*.recipient_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.actor_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.subscription_id"
            go_struct_tag: 'json:"-"'
          - column: "*.creator_id"
            go_struct_tag: 'json:"-"'
          - column: "*.timebox_id"
            go_struct_tag: 'json:"-"'
          - column: "*.source_task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.target_task_id"
            go_struct_tag: 'json:"-"'
          - column: "*.resolved_by"
            go_struct_tag: 'json:"-"'
          - column: "*.parent_page_id"
            go_struct_tag: 'json:"-"'
          - column: "*.label_id"
            go_struct_tag: 'json:"-"'
          - column: "*.parent_label_id"
            go_struct_tag: 'json:"-"'
          - column: "*.task_internal_id"
            go_struct_tag: 'json:"-"'
          - column: "*.user_internal_id"
            go_struct_tag: 'json:"-"'
          - column: "*.project_internal_id"
            go_struct_tag: 'json:"-"'
          - column: "*.event_internal_id"
            go_struct_tag: 'json:"-"'
          # Generated columns that exist solely to back de-NULLed UNIQUE indexes
          # (calendar_events.task_role_key STORED, calendar_event_attendees.event_id_key
          # VIRTUAL). Pure infrastructure derivatives — must never surface in JSON.
          - column: "*.task_role_key"
            go_struct_tag: 'json:"-"'
          - column: "*.event_id_key"
            go_struct_tag: 'json:"-"'
          - column: "*.comment_id"
            go_struct_tag: 'json:"-"'
          - column: "*.mentioned_user_id"
            go_struct_tag: 'json:"-"'
          # v_instance_audit_log LEFT JOINs workspaces, so this is NULL
          # for instance-level entries. PublicID.Scan maps NULL to the
          # zero UUID, which the mapper reads back as "no workspace" —
          # the same treatment auth-api gives the identical column.
          # Without the override sqlc hands back sql.NullString and the
          # raw 16 bytes are serialised as if they were text.
          - column: "*.target_workspace_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.target_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.entity_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.scope_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.mentioned_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.actor_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.actor_user_public_id"
            nullable: true
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
              pointer: true
          # triggered_by_signal_public_id is the public_id of the signal that
          # caused this event (ADR 0008 D4). Sourced from a LEFT JOIN to
          # signals so it is genuinely nullable: only events written by the
          # Applier carry a backlink.
          - column: "*.triggered_by_signal_public_id"
            nullable: true
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
              pointer: true
          # triggered_by_signal_id is the internal events.triggered_by_signal_id
          # FK back to signals.id; must not surface in JSON (the public_id
          # alias above is what the API exposes).
          - column: "*.triggered_by_signal_id"
            go_struct_tag: 'json:"-"'
          # reverses_event_public_id is the public_id of the event this row
          # compensates (ADR 0008 D4 / J5). Sourced from a LEFT self-join
          # on events (alias `e_rev`) so it is genuinely nullable: only the
          # compensating events written by the reversal handler carry a
          # backlink.
          - column: "*.reverses_event_public_id"
            nullable: true
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
              pointer: true
          # reverses_event_id is the internal events.reverses_event_id FK
          # back to events.id; must not surface in JSON (the public_id
          # alias above is what the API exposes).
          - column: "*.reverses_event_id"
            go_struct_tag: 'json:"-"'
          - column: "*.calendar_id"
            go_struct_tag: 'json:"-"'
          - column: "*.event_id"
            go_struct_tag: 'json:"-"'
          - column: "*.attendee_id"
            go_struct_tag: 'json:"-"'
          - column: "*.owner_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.created_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.updated_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.author_id"
            go_struct_tag: 'json:"-"'
          - column: "*.uploader_id"
            go_struct_tag: 'json:"-"'
          - column: "*.target_user_id"
            go_struct_tag: 'json:"-"'
          # Internal FK back-refs to storage_objects.id. The blob's external
          # identity is its storage_objects.public_id (UUID v7); the integer
          # FK must never appear in JSON responses.
          - column: "*.storage_object_id"
            go_struct_tag: 'json:"-"'
          - column: "*.avatar_storage_object_id"
            go_struct_tag: 'json:"-"'
          - column: "*.author_avatar_storage_object_id"
            go_struct_tag: 'json:"-"'
          # avatar_storage_object_public_id comes from LEFT JOIN storage_objects
          # in v_users / v_workspace_members / v_admin_users / v_comment_for_task,
          # so it is genuinely nullable.
          - column: "*.avatar_storage_object_public_id"
            nullable: true
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
              pointer: true
          - column: "*.author_avatar_storage_object_public_id"
            nullable: true
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
              pointer: true
          # storage_object_public_id alias on attachments / calendar_event_attachments
          # queries comes from INNER JOIN storage_objects so it is non-null.
          - column: "*.storage_object_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.calendar_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.resource_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.target_resource_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.signal_id"
            go_struct_tag: 'json:"-"'
          - column: "*.triaged_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.author_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.triaged_by_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.author_public_id"
            go_type:
              import: "github.com/libraz/nodate-flow/apps/flow-api/internal/db/types"
              package: "types"
              type: "PublicID"
          - column: "*.initiated_by_user_id"
            go_struct_tag: 'json:"-"'
          # tasks.agent_memo is JSON NOT NULL DEFAULT JSON_OBJECT(). The
          # default ensures freshly-created tasks have '{}' rather than NULL
          # so sqlc's default json.RawMessage scan path is safe. The mapper
          # treats '{}' as "no memo yet" (see buildAgentContext guard).
          # v_task_detail.agent_assignee_name comes from a COALESCEd
          # correlated subquery, which sqlc's MySQL parser can't type-infer
          # and emits as interface{}. Force string here; the underlying
          # ai_agents.name column is VARCHAR(255) NOT NULL and COALESCE
          # provides '' as the no-agent fallback.
          # The generated models cover the whole schema in every block, so
          # the exclusion list has to as well: a column tagged in one
          # block and forgotten in another publishes the same sequence
          # from whichever app reads it. TestGeneratedIDFieldsAreNotSerialized
          # in apps/flow-api/internal/db compares the three.
          - column: "*.granted_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.invited_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.judge_run_id"
            go_struct_tag: 'json:"-"'
          - column: "*.source_event_id"
            go_struct_tag: 'json:"-"'
          - column: "*.subject_id"
            go_struct_tag: 'json:"-"'
          - column: "*.task_created_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.task_project_id"
            go_struct_tag: 'json:"-"'
          - column: "v_task_detail.agent_assignee_name"
            go_type: "string"
  # --- flow-api calendar subpackage (calendar queries only) ---
