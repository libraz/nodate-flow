          - column: "*.owner_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.created_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.updated_by_user_id"
            go_struct_tag: 'json:"-"'
          - column: "*.author_id"
            go_struct_tag: 'json:"-"'
          - column: "*.uploader_id"
            go_struct_tag: 'json:"-"'
          - column: "*.target_user_id"
