version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - gosec
    - govet
    - revive
    - staticcheck
  settings:
    depguard:
      rules:
        crypto-internal:
          list-mode: lax
          files:
            - '!**/internal/http/handlers/auth/**'
            - '!**/internal/http/handlers/integrations/**'
            - '!**/internal/http/router/**'
            - '!**/internal/integrations/**'
            - '!**/internal/crypto/**'
            - '!**/cmd/api/**'
            - '!**/tests/**'
            - '!**/testutil/**'
          deny:
            - pkg: github.com/nodate-flow/nodate-flow/packages/go-shared/crypto
              desc: crypto package may only be imported from internal/http/handlers/auth, internal/http/handlers/integrations, internal/http/router, internal/integrations, internal/crypto, cmd/api, and tests
    forbidigo:
      forbid:
        - pattern: slog\.Int64\("(workspace|task|user|actor|project|page|label|comment|event|calendar|share|invite|session|identity)_id"
          msg: log public_id (UUID string), not internal int id; convention 18
        - pattern: slog\.Uint64\("(workspace|task|user|actor|project|page|label|comment|event|calendar|share|invite|session|identity)_id"
          msg: log public_id (UUID string), not internal int id; convention 18
      analyze-types: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - apps/auth-api/internal/db/generated
      - apps/auth-api/internal/errors
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - apps/auth-api/internal/db/generated
      - apps/auth-api/internal/errors
      - third_party$
      - builtin$
      - examples$
