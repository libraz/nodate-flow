version: "2"
run:
  go: "1.26"
issues:
  # Defaults are 50 per linter and 3 per identical message, which silently
  # truncates a report. A guard whose output stops at three lines cannot
  # be counted or trusted.
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - gosec
    - govet
    - revive
    - staticcheck
  settings:
    depguard:
      rules:
        crypto-internal:
          list-mode: lax
          files:
            - '!**/internal/ai/**'
            - '!**/internal/http/handlers/ai/**'
            - '!**/internal/http/router/**'
            - '!**/cmd/secrets-rotate/**'
            - '!**/cmd/api/**'
            - '!**/tests/**'
          deny:
            - pkg: github.com/libraz/nodate-flow/packages/go-shared/crypto
              desc: crypto package may only be imported from internal/ai, internal/http/handlers/ai, internal/http/router, cmd/api, cmd/secrets-rotate, and tests
    forbidigo:
      # Patterns are matched against the callee name ALONE. forbidigo has
      # no view of call arguments — analyze-types buys package resolution,
      # not argument text — so a pattern naming an attr key can never fire.
      # The earlier rules did exactly that and were dead from the day they
      # were written.
      #
      # The constructors are therefore banned outright and the two
      # legitimate shapes get named helpers: logutil.LogEntity for
      # identity, logutil.LogNumber for counts, sizes, durations and
      # status codes. logutil.LogNumber redacts id-shaped keys so it
      # cannot be used to smuggle the ban back open.
      #
      # This rule is a nudge for the author, not the boundary. It cannot
      # see slog.Any("workspace_id", ws.ID) nor the loose
      # logger.Warn(msg, "workspace_id", id) form; logutil.RedactHandler
      # suppresses those at the sink.
      forbid:
        - pattern: ^slog\.Int$
          msg: use logutil.LogEntity for ids or logutil.LogNumber for counts; convention 18
        - pattern: ^slog\.Int64$
          msg: use logutil.LogEntity for ids or logutil.LogNumber for counts; convention 18
        - pattern: ^slog\.Uint64$
          msg: use logutil.LogEntity for ids or logutil.LogNumber for counts; convention 18
      analyze-types: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Background pipelines that still log internal ids because their
      # call sites hold no public id and reaching one needs a query
      # change. The values do not leave the process — RedactHandler
      # replaces them with [REDACTED:internal-id] — so what remains here
      # is unconverted call sites, not live leaks. 90 sites: ai/signaljudge
      # 41, notification 20, ai/agentruntime 9, webhook 8, importer 7,
      # storagegc 3, eventbus 2. Shrink this list, never grow it.
      - path: ^internal/(ai|notification|webhook|importer|storagegc|eventbus)/
        linters:
          - forbidigo
    paths:
      - apps/flow-api/internal/db/generated
      - apps/flow-api/internal/errors
      - apps/flow-api/internal/signalkinds
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - apps/flow-api/internal/db/generated
      - apps/flow-api/internal/errors
      - apps/flow-api/internal/signalkinds
      - third_party$
      - builtin$
      - examples$
