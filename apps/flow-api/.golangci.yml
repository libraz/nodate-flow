run:
  timeout: 5m
  go: "1.23"

linters:
  disable-all: true
  enable:
    - gofmt
    - goimports
    - govet
    - staticcheck
    - errcheck
    - depguard
    - revive
    - gosec

linters-settings:
  depguard:
    rules:
      crypto-internal:
        list-mode: lax
        files:
          - "!**/internal/ai/**"
          - "!**/internal/http/handlers/ai/**"
          - "!**/cmd/secrets-rotate/**"
          - "!**/cmd/api/**"
          - "!**/tests/**"
        deny:
          - pkg: "github.com/nodate-flow/nodate-flow/packages/go-shared/crypto"
            desc: "crypto package may only be imported from internal/ai, internal/http/handlers/ai, cmd/api, cmd/secrets-rotate, and tests"

issues:
  exclude-dirs:
    - apps/flow-api/internal/db/generated
    - apps/flow-api/internal/errors
