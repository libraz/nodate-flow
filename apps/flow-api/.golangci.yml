version: "2"
run:
  go: "1.25"
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - gosec
    - govet
    - revive
    - staticcheck
  settings:
    depguard:
      rules:
        crypto-internal:
          list-mode: lax
          files:
            - '!**/internal/ai/**'
            - '!**/internal/http/handlers/ai/**'
            - '!**/cmd/secrets-rotate/**'
            - '!**/cmd/api/**'
            - '!**/tests/**'
          deny:
            - pkg: github.com/nodate-flow/nodate-flow/packages/go-shared/crypto
              desc: crypto package may only be imported from internal/ai, internal/http/handlers/ai, cmd/api, cmd/secrets-rotate, and tests
    forbidigo:
      forbid:
        - pattern: slog\.Int64\("(workspace|task|user|actor|project|page|label|comment|event|calendar|share|invite|reaction|widget|timebox|signal|suggestion|attachment|constraint|dependency|favorite|import_job|intake_item|version|widget_id)_id"
          msg: log public_id (UUID string), not internal int id; convention 18
        - pattern: slog\.Uint64\("(workspace|task|user|actor|project|page|label|comment|event|calendar|share|invite|reaction|widget|timebox|signal|suggestion|attachment|constraint|dependency|favorite|import_job|intake_item|version|widget_id)_id"
          msg: log public_id (UUID string), not internal int id; convention 18
      analyze-types: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - apps/flow-api/internal/db/generated
      - apps/flow-api/internal/errors
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - apps/flow-api/internal/db/generated
      - apps/flow-api/internal/errors
      - third_party$
      - builtin$
      - examples$
