<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_NAME%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          let theme = localStorage.getItem('nf.theme');
          if (!theme || !/^(glass|modern|washi|classic|nothing)-(light|dark)$/.test(theme)) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'glass-dark'
              : 'glass-light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch {
          document.documentElement.setAttribute('data-theme', 'glass-dark');
        }
        try {
          const storedLang = localStorage.getItem('nf.lang');
          let lang;
          if (storedLang && /^(en|ja|zh)$/.test(storedLang)) {
            lang = storedLang;
          } else {
            const nav = (navigator.language || 'en').toLowerCase();
            lang = nav.indexOf('ja') === 0 ? 'ja' : nav.indexOf('zh') === 0 ? 'zh' : 'en';
          }
          document.documentElement.setAttribute('lang', lang);
        } catch {
          document.documentElement.setAttribute('lang', 'en');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
