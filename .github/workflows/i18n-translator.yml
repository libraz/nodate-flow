# 2.AI-10 i18n translator bot.
#
# On PRs that touch apps/flow-web/locales/en/**, this workflow scaffolds
# placeholder ja entries for every missing key and opens a follow-up PR
# tagged `needs-translation-review`. The v1 scaffold is deterministic —
# an LLM path can replace scripts/i18n-translate.mjs without changing
# the workflow contract.
name: i18n-translator

on:
  pull_request:
    paths:
      - "apps/flow-web/locales/en/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold-ja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Scaffold missing ja keys
        id: scaffold
        run: |
          node scripts/i18n-translate.mjs --write | tee /tmp/i18n.log
          if git diff --quiet apps/flow-web/locales/ja; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open follow-up PR
        if: steps.scaffold.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: i18n/ja-scaffold-${{ github.event.pull_request.number }}
          base: ${{ github.event.pull_request.head.ref }}
          title: "chore(i18n): scaffold ja placeholders for #${{ github.event.pull_request.number }}"
          body: |
            Auto-generated placeholders for keys newly added to `apps/flow-web/locales/en/**`.
            Every new ja string is prefixed with `[TODO:ja]` — a human translator must review
            and replace before merge.
          labels: needs-translation-review
          commit-message: "chore(i18n): scaffold ja placeholders"
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: node scripts/i18n-translate.mjs --check
