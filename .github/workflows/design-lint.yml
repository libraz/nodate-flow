name: Design Lint

on:
  pull_request:
    paths:
      - 'apps/*/src/**/*.css'
      - 'apps/*/src/**/*.tsx'
      - 'apps/*/src/**/*.ts'
      - 'packages/ui/src/**/*.css'

jobs:
  design-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hardcoded color scan
        run: bash scripts/check-hardcoded-colors.sh --ci

      - name: Hardcoded UI string scan
        run: bash scripts/check-hardcoded-strings.sh --ci

      - name: Token fallback scan
        run: bash scripts/check-token-fallbacks.sh --ci

      - name: Theme parity check
        run: |
          npm ci --workspace=packages/ui
          npm run check-themes --workspace=packages/ui

      - name: Legacy token scan
        run: |
          echo "Scanning for legacy --color-* token references..."
          HITS=$(grep -rn 'var(--color-' apps/*/src/ packages/ui/src/primitives/ 2>/dev/null | grep -v 'node_modules' | grep -v '.d.ts' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Found legacy --color-* token references. Migrate to --nf-color-*:"
            echo "$HITS"
            exit 1
          fi
          echo "✓ No legacy --color-* tokens found."

      - name: Hardcoded transition scan
        run: |
          echo "Scanning for hardcoded transition durations..."
          HITS=$(grep -rnE 'transition:.*[0-9]+(\.[0-9]+)?s\s+(ease|linear|ease-in|ease-out)' apps/*/src/ packages/ui/src/primitives/ --include='*.css' 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Found hardcoded transition durations. Use --nf-duration-* and --nf-ease-* tokens:"
            echo "$HITS"
            exit 1
          fi
          echo "✓ No hardcoded transitions found."
