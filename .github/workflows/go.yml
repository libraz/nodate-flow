name: go

on:
  pull_request:
    paths:
      - 'apps/flow-api/**'
      - 'sql/**'
      - 'go.work'
      - '.github/workflows/go.yml'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: go build (default)
        run: go build ./apps/flow-api/...
      - name: go build (-tags redis)
        run: go build -tags redis ./apps/flow-api/...
      - name: go vet
        run: go vet ./apps/flow-api/...
      - name: go test (unit)
        run: go test -short ./apps/flow-api/...
