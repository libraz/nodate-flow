name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.0"
  BUN_VERSION: "1.4.1"
  # Pinned for the same reason the Go and bun versions are: a linter
  # release that adds a check would otherwise turn main red on its own
  # schedule, and it would disagree with the version a contributor has
  # installed locally.
  GOLANGCI_LINT_VERSION: "v2.11.4"

jobs:
  web:
    name: Web (format, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome check covers both formatting and linting.
      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      # Compares every apps/*/locales/<lang> against its English reference
      # and rejects empty values and i18next-native '{{var}}' placeholders.
      # Nothing else in CI reads the locale files, so without this step a
      # namespace can go missing in one language and ship green.
      - name: i18n locales
        run: make i18n-check

      # A route that re-declares a response shape locally compiles against
      # its own copy, so the mismatch with the wire format is invisible to
      # both the typechecker and the build — it surfaces as an empty page
      # at runtime.
      - name: Hand-rolled response DTOs
        run: make check-dtos

      # A token reference carrying a stray closing paren is invalid CSS:
      # the declaration is dropped whole, silently. It appeared once, then
      # spread across the styles before anything noticed, which is what
      # the scan exists to prevent — it can only do that from here.
      - name: Malformed token references
        run: make check-css-var-parens

      # The auth-free router is a security boundary, and the only thing
      # standing between it and an accidentally public route is this
      # allowlist. It reads the committed spec plus the router source, so
      # it needs no Go toolchain and belongs with the other fast gates.
      - name: Public router surface
        run: make check-public-router

      # A form field's maximum length is written twice: once in the Go
      # input struct, which reaches the OpenAPI document as `maxLength`,
      # and once in the Zod schema the form validates with. A frontend
      # bound wider than the document's lets a value through the form that
      # the server then refuses — a 422 where an inline field error
      # belongs. It reads the committed spec plus the web sources, so it
      # needs no Go toolchain either.
      - name: Web input bounds
        run: make check-web-bounds

      # The country allowlist is written twice and nothing generates one
      # side from the other. A code only the form knows fails on save with
      # an error naming a field nobody touched; a code only the API knows
      # is simply unreachable. The check parses the Go source as text, so
      # it needs no Go toolchain either.
      - name: Region allowlist parity
        run: make check-region-parity

      # packages/sdk is bundled into both browser apps. A single stray
      # `/// <reference types="node" />` switches the Node globals back on
      # for the whole project, so Buffer and process typecheck everywhere
      # and fail only in a browser.
      - name: Browser SDK Node types
        run: make check-sdk-browser-safe

      # Two operations that were never declared to share a response
      # schema but resolve to one component are indistinguishable from
      # two that agree: the SDK gives both call sites the same type, so
      # a change made for one silently redefines the other. It reads the
      # committed spec, so no Go toolchain is needed.
      - name: OpenAPI schema collisions
        run: make check-schema-collisions

      # A var() naming a token nothing defines takes its whole
      # declaration down with it, so the style is simply absent — no
      # error, no fallback, and nothing else in the pipeline reads CSS
      # closely enough to notice.
      - name: Design token references
        run: make check-tokens

      # semantic.css is the contract every theme has to satisfy, and it
      # is also the only value an unthemed document gets. A token added
      # to the six themes but not to the contract compiles, renders in
      # the app, and has no value anywhere else — which is how five of
      # them shipped.
      - name: Theme parity
        run: make check-themes

      # A literal colour does not follow the theme: it is right in
      # whichever theme the author had open and wrong in the other five,
      # and it looks like an ordinary value forever after.
      - name: Hardcoded colours
        run: make check-colors

      # Same argument for spacing and type. Both of these scans existed
      # for a long time without anything running them.
      - name: Hardcoded spacing and type
        run: make check-spacing

      # CSS cannot read the breakpoint scale — every media query restates
      # it by hand, and the restatements had drifted a pixel away from
      # what the JS uses, putting the two on opposite sides of the
      # boundary.
      - name: Breakpoint scale
        run: make check-breakpoints

      # A literal in an attribute reads as markup rather than as copy,
      # which is why it is the easiest place for a string to escape
      # translation: the page renders, every locale loads, and one label
      # stays English everywhere.
      - name: Hardcoded UI strings
        run: make check-strings

      # A toast built from a fixed sentence reports the same thing
      # whatever went wrong, so the one detail that would identify the
      # failure — the caught error — never reaches the person looking at
      # it, and the mutation looks handled.
      - name: Error-path toasts
        run: make check-error-toasts

      # The guard over the guards. Several of the scans above sat in the
      # tree for months with nothing invoking them, which reports exactly
      # like a scan that passes. This one fails when a script exists that
      # no gate runs, so the next one cannot go quiet the same way.
      - name: Every guard is reachable
        run: make check-reachability

      - name: Unit tests (holidays)
        working-directory: packages/holidays
        run: bun run test

      - name: Unit tests (flow-web)
        working-directory: apps/flow-web
        run: bun run test --coverage

      - name: Unit tests (accounts-web)
        working-directory: apps/accounts-web
        run: bun run test --coverage

      # The remaining TypeScript workspaces. A suite that no pipeline
      # invokes reports nothing, which reads exactly like a suite that
      # passes.
      - name: Unit tests (cli)
        working-directory: apps/cli
        run: bun run test

      - name: Unit tests (ui)
        working-directory: packages/ui
        run: bun run test

      - name: Unit tests (sdk)
        working-directory: packages/sdk
        run: bun run test

      - name: Build (flow-web)
        working-directory: apps/flow-web
        run: bun run build

      - name: Build (accounts-web)
        working-directory: apps/accounts-web
        run: bun run build

      # Public repo: codecov runs tokenless. Uploads never gate CI.
      - name: Upload coverage (flow-web)
        uses: codecov/codecov-action@v5
        with:
          files: apps/flow-web/coverage/lcov.info
          flags: flow-web
          fail_ci_if_error: false

      - name: Upload coverage (accounts-web)
        uses: codecov/codecov-action@v5
        with:
          files: apps/accounts-web/coverage/lcov.info
          flags: accounts-web
          fail_ci_if_error: false

  openapi:
    name: OpenAPI (spec + SDK drift)
    # The committed spec and the generated TS SDK are what every frontend
    # type-checks against, and both are produced from the Go handlers.
    # Nothing else in the pipeline regenerates them, so a handler change
    # that was never dumped — or a spec that was dumped but never run
    # through openapi-typescript — reaches main with the whole build green.
    # Needs both toolchains: Go to dump the two services, bun/node to
    # regenerate the types.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # The two services are dumped, then the tool module merges the
          # two specs, so all three take part in this job.
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum
            scripts/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Spec and SDK match the Go sources
        run: make test-openapi-diff

  schema:
    name: Schema (drift, core contract)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: conformance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pconformance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - name: Schema drift
        run: bash scripts/schema-diff.sh

      # The contract is vendored into other repositories, so a comment
      # citing a file only this repository has arrives as a dead pointer.
      - name: Core is self-contained
        run: bash scripts/core-self-contained.sh

      # A schema change and the code generated from it are one change, but
      # nothing else in the pipeline can tell them apart: a field the
      # generator never emitted simply does not exist, so the build succeeds
      # and the tests pass while the column is unreachable.
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install sqlc
        # The version is read from the checker so the two cannot disagree;
        # different sqlc versions emit different code from the same input.
        run: |
          version=$(grep -m1 '^SQLC_VERSION=' scripts/check-codegen-drift.sh | cut -d'"' -f2)
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$version"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Not every generator behind this target is a Go one: the embedded
      # holiday dataset is regenerated by a bun script that reads the
      # workspace holiday package, so the job needs the runtime and the
      # installed dependencies as well as the Go toolchain.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generated code matches the schema and the error catalog
        run: make verify-codegen

      # The contract is checked against both shapes a deployment can take.
      # Core alone is what an implementor that hosts no task layer applies,
      # and it is the shape most likely to rot unnoticed, because nothing
      # in this repository runs on it.
      - name: Core contract (core layer only)
        run: |
          mysql -h 127.0.0.1 -uroot -pconformance -e 'CREATE DATABASE core_only'
          bash sql/build-schema.sh core \
            | mysql -h 127.0.0.1 -uroot -pconformance core_only
          bash sql/core/conformance/run.sh \
            --dsn 'root:conformance@127.0.0.1:3306/core_only' --mode all

      - name: Core contract (core + flow layers)
        run: |
          mysql -h 127.0.0.1 -uroot -pconformance -e 'CREATE DATABASE full_stack'
          mysql -h 127.0.0.1 -uroot -pconformance full_stack < sql/schema.sql
          bash sql/core/conformance/run.sh \
            --dsn 'root:conformance@127.0.0.1:3306/full_stack' --mode all

  api:
    name: API (format, lint, test)
    # GitHub-hosted Linux runners ship a running Docker daemon, which is what
    # testcontainers needs to boot the MySQL and MinIO instances the
    # integration and e2e suites run against. Moving this job to a runner
    # without Docker turns those suites off again.
    runs-on: ubuntu-latest
    # Container startup can hang instead of erroring; cap it well above a
    # normal run so a stuck daemon is reported rather than billed.
    timeout-minutes: 45
    env:
      # The suites that cover cross-tenant access, IDOR, and secret leakage
      # only run when this is set, and they are skipped rather than failed
      # when it is not — so leaving it unset means CI reports green on a run
      # that exercised none of them.
      NF_TEST_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum
            apps/flow-worker/go.sum
            apps/presence-discord/go.sum
            packages/go-shared/go.sum
            scripts/go.sum

      # Installed rather than run through the linter's own action: that
      # action lints one directory per invocation, so using it would put
      # a second copy of the module list in this file. The tool module is
      # the reason the version has to be installed at all — the action
      # would not see it, because it is outside go.work.
      - name: Install golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The four Go gates below are the make targets, called rather than
      # restated. Each derives its module set from every go.mod in the
      # tree, so a module added later is covered here without anyone
      # remembering to edit this file — a list written out in YAML reads
      # as exhaustive and stops being true silently.
      - name: Gofmt check
        run: make format-check-go

      - name: Golangci-lint
        run: make lint-go

      - name: Go vet
        run: make vet

      - name: Build
        run: make build-go

      # Reads Go sources, compose.yml and the scrape configuration
      # together, so it belongs to the job that has a Go toolchain rather
      # than to the script guards in the web job.
      - name: Metrics wiring
        run: make check-metrics-wiring

      # Called as the make target rather than through the suite below, so
      # the counts it prints on a passing run are in the log: a scan that
      # has stopped matching reports the same clean result as a tree whose
      # provider calls are all accounted for.
      - name: AI invocation outcome
        run: make check-ai-outcome

      # -short is deliberately absent: the integration guards skip on it as
      # well as on NF_TEST_INTEGRATION, so passing it would silence the
      # suites this job just opted into.
      - name: Tests (flow-api)
        working-directory: apps/flow-api
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Tests (auth-api)
        working-directory: apps/auth-api
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Tests (flow-worker)
        working-directory: apps/flow-worker
        run: go test -race -count=1 ./...

      - name: Tests (presence-discord)
        working-directory: apps/presence-discord
        run: go test -race -count=1 ./...

      - name: Tests (go-shared)
        working-directory: packages/go-shared
        run: go test -race -count=1 ./...

      # Public repo: codecov runs tokenless. Uploads never gate CI.
      - name: Upload coverage (flow-api)
        uses: codecov/codecov-action@v5
        with:
          files: apps/flow-api/coverage.out
          flags: flow-api
          fail_ci_if_error: false

      - name: Upload coverage (auth-api)
        uses: codecov/codecov-action@v5
        with:
          files: apps/auth-api/coverage.out
          flags: auth-api
          fail_ci_if_error: false
