name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.0"
  BUN_VERSION: "1.3.11"

jobs:
  # ---------- Job 1: Lint and typecheck (Go + TS in parallel steps) ----------
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: i18n locale guard (missing ja keys, empty values, '{{var}}' under ICU)
        run: node scripts/i18n-translate.mjs --check

      - name: golangci-lint (flow-api)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: apps/flow-api

      - name: Go vet (flow-api)
        run: go vet ./...
        working-directory: apps/flow-api

      - name: golangci-lint (auth-api)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: apps/auth-api

      - name: Go vet (auth-api)
        run: go vet ./...
        working-directory: apps/auth-api

  # ---------- Job 2: Unit tests (Go short + Vitest) ----------
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Go test (short) — flow-api
        run: go test -short -race -count=1 ./...
        working-directory: apps/flow-api

      - name: Go test (short) — auth-api
        run: go test -short -race -count=1 ./...
        working-directory: apps/auth-api

      - name: Vitest with coverage
        run: bun run test -- --coverage
        working-directory: apps/flow-web

      - name: Check Vitest coverage threshold (80%)
        working-directory: apps/flow-web
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            echo "Total line coverage: ${COVERAGE}%"
            if [ "$(echo "${COVERAGE} < 80" | bc -l)" -eq 1 ]; then
              echo "::error::Vitest line coverage ${COVERAGE}% is below 80% threshold"
              exit 1
            fi
          else
            echo "::warning::No coverage summary found, skipping threshold check"
          fi

  # ---------- Job 3: Integration tests (Go E2E + Playwright) ----------
  #
  # The matrix runs the flow-api E2E suite twice:
  #
  #   - ai_mock="1"  exercises tests gated on NF_FLOW_AI_MOCK=1 (deterministic
  #     mock AI orchestrator: ai_triage / ai_compile_lens / mcp_duplicates /
  #     task_duplicates).
  #   - ai_mock=""   leaves NF_FLOW_AI_MOCK unset so the real per-tenant
  #     workspace provider path is wired in. Required by
  #     ai_provider_failures_test.go which skips when the mock is on.
  #
  # Both modes share the same testcontainers boot cost (~30s cold), so the
  # matrix roughly doubles the integration job wall time vs a single run
  # but keeps both surfaces honest. Playwright + auth-api + the heavier
  # web build only run in the mock-on shard to avoid duplicating work
  # that does not depend on NF_FLOW_AI_MOCK.
  test-integration:
    name: Integration tests (ai_mock=${{ matrix.ai_mock || 'off' }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        ai_mock: ["1", ""]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        if: matrix.ai_mock == '1'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/flow-web

      # Integration tests use testcontainers (MySQL, MinIO, Redis).
      # The containers are started automatically by Go test helpers.
      # The flow-api job also covers the calendar/event suite that
      # used to live under apps/time-api/tests/.

      - name: Go test (full, with testcontainers) — flow-api
        env:
          NF_TEST_INTEGRATION: "1"
          NF_FLOW_AI_MOCK: ${{ matrix.ai_mock }}
        run: go test -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: apps/flow-api

      - name: Check Go coverage threshold (80%) — flow-api
        working-directory: apps/flow-api
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < 80" | bc -l)" -eq 1 ]; then
            echo "::error::Go coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi

      - name: Go test (full, with testcontainers) — auth-api
        if: matrix.ai_mock == '1'
        run: go test -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: apps/auth-api

      - name: Build web for E2E
        if: matrix.ai_mock == '1'
        run: bun run build
        working-directory: apps/flow-web

      - name: Playwright E2E
        if: matrix.ai_mock == '1'
        run: bun run e2e
        working-directory: apps/flow-web

      - name: Upload Playwright report
        if: failure() && matrix.ai_mock == '1'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/flow-web/playwright-report/
          retention-days: 14

  # ---------- Job 4: Security (main only, placeholder) ----------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Go vulnerability check — flow-api
        run: govulncheck ./...
        working-directory: apps/flow-api

      - name: Go vulnerability check — auth-api
        run: govulncheck ./...
        working-directory: apps/auth-api

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Bun dependency audit
        run: bunx npm-audit --production

  # ---------- Job 5a: OpenAPI drift guard ----------
  # Regenerate every OpenAPI spec from the current Go sources and fail if
  # the committed copies differ. Catches silent spec drift before it
  # reaches schemathesis or the TS SDK consumers.
  openapi-diff:
    name: OpenAPI drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Verify OpenAPI specs match Go sources
        run: ./scripts/openapi-diff.sh

      - name: Verify merged spec has no schema name collisions
        run: ./scripts/check-schema-collisions.sh

      - name: Verify sql/schema.sql matches sql/tables and sql/views
        run: ./scripts/schema-diff.sh

      - name: Verify public router allowlist (no auth-required path leaks into public surface)
        run: bun run scripts/check-public-router.ts

  # ---------- Job 5b: Contract tests (Schemathesis against OpenAPI spec) ----------
  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    needs: [test-integration]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate OpenAPI spec
        run: |
          cd apps/flow-api && go run ./cmd/dump-openapi -o ../../packages/sdk/openapi-flow.json
          cd ../../apps/auth-api && go run ./cmd/dump-openapi -o ../../packages/sdk/openapi-auth.json
          cd ../../scripts && go run merge-openapi.go -o ../packages/sdk/openapi.json ../packages/sdk/openapi-flow.json ../packages/sdk/openapi-auth.json
          rm -f packages/sdk/openapi-flow.json packages/sdk/openapi-auth.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Schemathesis
        run: pip install schemathesis

      - name: Validate OpenAPI spec (offline)
        run: |
          schemathesis run packages/sdk/openapi.json \
            --dry-run \
            --checks all \
            --validate-schema=true

      - name: Run contract tests against OpenAPI spec
        run: |
          schemathesis run packages/sdk/openapi.json \
            --stateful=links \
            --checks all \
            --hypothesis-max-examples=50
