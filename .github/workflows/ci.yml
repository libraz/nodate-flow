name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.0"
  BUN_VERSION: "1.3.11"

jobs:
  web:
    name: Web (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (flow-web)
        working-directory: apps/flow-web
        run: bun run test

      - name: Unit tests (accounts-web)
        working-directory: apps/accounts-web
        run: bun run test

      - name: Build (flow-web)
        working-directory: apps/flow-web
        run: bun run build

      - name: Build (accounts-web)
        working-directory: apps/accounts-web
        run: bun run build

  api:
    name: API (build, vet, e2e)
    runs-on: ubuntu-latest
    # Integration tests use testcontainers (MySQL, MinIO, Redis) started by
    # Go test helpers. The matrix runs the flow-api suite twice: ai_mock="1"
    # exercises the deterministic mock AI orchestrator; ai_mock="" wires the
    # real per-tenant workspace provider path.
    strategy:
      fail-fast: false
      matrix:
        ai_mock: ["1", ""]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum

      - name: Build (flow-api)
        working-directory: apps/flow-api
        run: go build ./...

      - name: Build (auth-api)
        working-directory: apps/auth-api
        run: go build ./...

      - name: Go vet (flow-api)
        working-directory: apps/flow-api
        run: go vet ./...

      - name: Go vet (auth-api)
        working-directory: apps/auth-api
        run: go vet ./...

      - name: Integration tests (flow-api)
        working-directory: apps/flow-api
        env:
          NF_TEST_INTEGRATION: "1"
          NF_FLOW_AI_MOCK: ${{ matrix.ai_mock }}
        run: go test -race -count=1 -timeout=10m ./...

      - name: Integration tests (auth-api)
        if: matrix.ai_mock == '1'
        working-directory: apps/auth-api
        run: go test -race -count=1 -timeout=10m ./...
