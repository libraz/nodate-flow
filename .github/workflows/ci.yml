name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.0"
  BUN_VERSION: "1.3.11"

jobs:
  web:
    name: Web (format, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome check covers both formatting and linting.
      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (flow-web)
        working-directory: apps/flow-web
        run: bun run test --coverage

      - name: Unit tests (accounts-web)
        working-directory: apps/accounts-web
        run: bun run test --coverage

      - name: Build (flow-web)
        working-directory: apps/flow-web
        run: bun run build

      - name: Build (accounts-web)
        working-directory: apps/accounts-web
        run: bun run build

      # Public repo: codecov runs tokenless. Uploads never gate CI.
      - name: Upload coverage (flow-web)
        uses: codecov/codecov-action@v5
        with:
          files: apps/flow-web/coverage/lcov.info
          flags: flow-web
          fail_ci_if_error: false

      - name: Upload coverage (accounts-web)
        uses: codecov/codecov-action@v5
        with:
          files: apps/accounts-web/coverage/lcov.info
          flags: accounts-web
          fail_ci_if_error: false

  schema:
    name: Schema (drift, core contract)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.6
        env:
          MYSQL_ROOT_PASSWORD: conformance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pconformance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - name: Schema drift
        run: bash scripts/schema-diff.sh

      # The contract is checked against both shapes a deployment can take.
      # Core alone is what an implementor that hosts no task layer applies,
      # and it is the shape most likely to rot unnoticed, because nothing
      # in this repository runs on it.
      - name: Core contract (core layer only)
        run: |
          mysql -h 127.0.0.1 -uroot -pconformance -e 'CREATE DATABASE core_only'
          bash sql/build-schema.sh core \
            | mysql -h 127.0.0.1 -uroot -pconformance core_only
          bash sql/core/conformance/run.sh \
            --dsn 'root:conformance@127.0.0.1:3306/core_only' --mode all

      - name: Core contract (core + flow layers)
        run: |
          mysql -h 127.0.0.1 -uroot -pconformance -e 'CREATE DATABASE full_stack'
          mysql -h 127.0.0.1 -uroot -pconformance full_stack < sql/schema.sql
          bash sql/core/conformance/run.sh \
            --dsn 'root:conformance@127.0.0.1:3306/full_stack' --mode all

  api:
    name: API (format, lint, test)
    runs-on: ubuntu-latest
    # CI runs unit tests only. Integration and e2e suites that need a database
    # (testcontainers) are excluded: NF_TEST_INTEGRATION is left unset and
    # -short is passed so those suites skip.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum

      - name: Gofmt check (flow-api)
        working-directory: apps/flow-api
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::unformatted Go files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Gofmt check (auth-api)
        working-directory: apps/auth-api
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::unformatted Go files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Go vet (flow-api)
        working-directory: apps/flow-api
        run: go vet ./...

      - name: Go vet (auth-api)
        working-directory: apps/auth-api
        run: go vet ./...

      - name: Build (flow-api)
        working-directory: apps/flow-api
        run: go build ./...

      - name: Build (auth-api)
        working-directory: apps/auth-api
        run: go build ./...

      - name: Unit tests (flow-api)
        working-directory: apps/flow-api
        run: go test -short -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Unit tests (auth-api)
        working-directory: apps/auth-api
        run: go test -short -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      # Public repo: codecov runs tokenless. Uploads never gate CI.
      - name: Upload coverage (flow-api)
        uses: codecov/codecov-action@v5
        with:
          files: apps/flow-api/coverage.out
          flags: flow-api
          fail_ci_if_error: false

      - name: Upload coverage (auth-api)
        uses: codecov/codecov-action@v5
        with:
          files: apps/auth-api/coverage.out
          flags: auth-api
          fail_ci_if_error: false
