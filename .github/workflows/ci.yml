name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"
  BUN_VERSION: "latest"

jobs:
  # ---------- Job 1: Lint and typecheck (Go + TS in parallel steps) ----------
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum
            apps/time-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: golangci-lint (flow-api)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: apps/flow-api

      - name: Go vet (flow-api)
        run: go vet ./...
        working-directory: apps/flow-api

      - name: golangci-lint (auth-api)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: apps/auth-api

      - name: Go vet (auth-api)
        run: go vet ./...
        working-directory: apps/auth-api

      - name: golangci-lint (time-api)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: apps/time-api

      - name: Go vet (time-api)
        run: go vet ./...
        working-directory: apps/time-api

  # ---------- Job 2: Unit tests (Go short + Vitest) ----------
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum
            apps/time-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Go test (short) — flow-api
        run: go test -short -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: apps/flow-api

      - name: Check Go coverage threshold (80%) — flow-api
        working-directory: apps/flow-api
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < 80" | bc -l)" -eq 1 ]; then
            echo "::error::Go coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi

      - name: Go test (short) — auth-api
        run: go test -short -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: apps/auth-api

      - name: Go test (short) — time-api
        run: go test -short -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: apps/time-api

      - name: Vitest with coverage
        run: bun run test -- --coverage
        working-directory: apps/flow-web

  # ---------- Job 3: Integration tests (Go E2E + Playwright) ----------
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum
            apps/time-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/flow-web

      # Integration tests use testcontainers (MySQL, MinIO, Redis).
      # The containers are started automatically by Go test helpers.

      - name: Go test (full, with testcontainers) — flow-api
        run: go test -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: apps/flow-api

      - name: Check Go coverage threshold (80%) — flow-api
        working-directory: apps/flow-api
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < 80" | bc -l)" -eq 1 ]; then
            echo "::error::Go coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi

      - name: Go test (full, with testcontainers) — auth-api
        run: go test -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: apps/auth-api

      - name: Go test (full, with testcontainers) — time-api
        run: go test -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: apps/time-api

      - name: Build web for E2E
        run: bun run build
        working-directory: apps/flow-web

      - name: Playwright E2E
        run: bun run e2e
        working-directory: apps/flow-web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/flow-web/playwright-report/
          retention-days: 14

  # ---------- Job 4: Security (main only, placeholder) ----------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum
            apps/time-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Go vulnerability check — flow-api
        run: govulncheck ./...
        working-directory: apps/flow-api

      - name: Go vulnerability check — auth-api
        run: govulncheck ./...
        working-directory: apps/auth-api

      - name: Go vulnerability check — time-api
        run: govulncheck ./...
        working-directory: apps/time-api

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Bun dependency audit
        run: bunx npm-audit --production

  # ---------- Job 5: Contract tests (Schemathesis against OpenAPI spec) ----------
  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    needs: [test-integration]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/flow-api/go.sum
            apps/auth-api/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate OpenAPI spec
        run: |
          cd apps/flow-api && go run ./cmd/dump-openapi -o ../../packages/sdk/openapi-flow.json
          cd ../../apps/auth-api && go run ./cmd/dump-openapi -o ../../packages/sdk/openapi-auth.json
          cd ../../scripts && go run merge-openapi.go -o ../packages/sdk/openapi.json ../packages/sdk/openapi-flow.json ../packages/sdk/openapi-auth.json
          rm -f packages/sdk/openapi-flow.json packages/sdk/openapi-auth.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Schemathesis
        run: pip install schemathesis

      - name: Validate OpenAPI spec (offline)
        run: |
          schemathesis run packages/sdk/openapi.json \
            --dry-run \
            --checks all \
            --validate-schema=true

      - name: Run contract tests against OpenAPI spec
        run: |
          schemathesis run packages/sdk/openapi.json \
            --stateful=links \
            --checks all \
            --hypothesis-max-examples=50
