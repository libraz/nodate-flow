# Local development compose stack for nodate-flow.
services:
  mysql:
    image: mysql:9.1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NF_DB_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${NF_DB_NAME:-nodate_flow}
      MYSQL_USER: ${NF_DB_USER:-nodate}
      MYSQL_PASSWORD: ${NF_DB_PASSWORD:-nodatepw}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=256
    ports:
      - "${NF_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema is auto-applied on first boot (empty volume). Regenerate
      # with `make db-schema` whenever sql/tables or sql/views change.
      # To re-apply into an existing volume, use `make db-apply`.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${NF_DB_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${NF_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${NF_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${NF_S3_SECRET_KEY:-minioadmin}
    ports:
      - "${NF_S3_PORT:-9000}:9000"
      - "${NF_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${NF_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${NF_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Observability stack ---------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    volumes:
      - ./infra/otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${NF_OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${NF_OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${NF_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${NF_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${NF_GRAFANA_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: "3001"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${NF_GRAFANA_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NF_PORT: "8080"
      NF_LOG_LEVEL: ${NF_LOG_LEVEL:-info}
      NF_DB_DSN: ${NF_DB_DSN:-nodate:nodatepw@tcp(mysql:3306)/nodate_flow?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci}
      NF_REDIS_ADDR: ${NF_REDIS_ADDR:-redis:6379}
      NF_SESSION_STORE: ${NF_SESSION_STORE:-mysql}
      NF_STREAM_BACKEND: ${NF_STREAM_BACKEND:-memory}
      NF_OUTBOUND_BACKEND: ${NF_OUTBOUND_BACKEND:-memory}
      NF_AGENT_TICK_INTERVAL: ${NF_AGENT_TICK_INTERVAL:-1m}
      NF_SECRET_KEY: ${NF_SECRET_KEY:-}
      NF_DEFAULT_WORKSPACE_ID: ${NF_DEFAULT_WORKSPACE_ID:-}
      NF_GH_WEBHOOK_SECRET: ${NF_GH_WEBHOOK_SECRET:-}
      NF_SLACK_SIGNING_SECRET: ${NF_SLACK_SIGNING_SECRET:-}
      NF_AI_DAILY_BUDGET_CENTS: ${NF_AI_DAILY_BUDGET_CENTS:-}
      NF_S3_ENDPOINT: ${NF_S3_ENDPOINT:-minio:9000}
      NF_S3_ACCESS_KEY: ${NF_S3_ACCESS_KEY:-minioadmin}
      NF_S3_SECRET_KEY: ${NF_S3_SECRET_KEY:-minioadmin}
      NF_S3_BUCKET: ${NF_S3_BUCKET:-nodate-flow}
      NF_S3_USE_SSL: ${NF_S3_USE_SSL:-false}
      NF_SMTP_HOST: ${NF_SMTP_HOST:-mailpit}
      NF_SMTP_PORT: ${NF_SMTP_PORT:-1025}
      NF_SMTP_USERNAME: ${NF_SMTP_USERNAME:-}
      NF_SMTP_PASSWORD: ${NF_SMTP_PASSWORD:-}
      NF_SMTP_FROM: ${NF_SMTP_FROM:-noreply@nodate-flow.local}
      # OTLP collector endpoint (gRPC). Traces and metrics are sent here.
      NF_OTEL_ENDPOINT: ${NF_OTEL_ENDPOINT:-otel-collector:4317}
      NF_OTEL_INSECURE: ${NF_OTEL_INSECURE:-true}
      NF_VERSION: ${NF_VERSION:-dev}
    ports:
      - "${NF_API_PORT:-8080}:8080"
    healthcheck:
      test: ["/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
  minio_data:
  prometheus_data:
  grafana_data:
