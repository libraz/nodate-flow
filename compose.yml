# Local development compose stack for nodate-flow.
services:
  mysql:
    image: mysql:9.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NF_DB_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${NF_DB_NAME:-nodate_flow}
      MYSQL_USER: ${NF_DB_USER:-nodate}
      MYSQL_PASSWORD: ${NF_DB_PASSWORD:-nodatepw}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=256
      # Every stored DATETIME is a UTC wall clock, and queries compare
      # them against NOW(). Left to the host's zone the two disagree by
      # its offset with no error anywhere: OAuth states expire early,
      # webhook backoff windows read as already past, invites vanish
      # ahead of time. The services pin the session zone in their DSN as
      # well; this makes the default right for anything that connects
      # without one, such as a mysql shell.
      - --default-time-zone=+00:00
    ports:
      - "${NF_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema is auto-applied on first boot (empty volume). Regenerate
      # with `make db-schema` whenever sql/core or sql/flow change.
      # To re-apply into an existing volume, use `make db-apply`.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${NF_DB_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${NF_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${NF_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${NF_S3_SECRET_KEY:-minioadmin}
    ports:
      - "${NF_S3_PORT:-9000}:9000"
      - "${NF_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${NF_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${NF_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Observability stack ---------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    restart: unless-stopped
    volumes:
      - ./infra/otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${NF_OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${NF_OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${NF_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${NF_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${NF_GRAFANA_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: "3001"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${NF_GRAFANA_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/flow-api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NF_FLOW_PORT: "8080"
      NF_FLOW_LOG_LEVEL: ${NF_FLOW_LOG_LEVEL:-info}
      NF_DB_DSN: ${NF_DB_DSN:-nodate:nodatepw@tcp(mysql:3306)/nodate_flow?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci&time_zone=%27%2B00%3A00%27}
      NF_COOKIE_SECURE: "false"
      NF_REDIS_ADDR: ${NF_REDIS_ADDR:-redis:6379}
      NF_FLOW_SESSION_STORE: ${NF_FLOW_SESSION_STORE:-mysql}
      NF_FLOW_STREAM_BACKEND: ${NF_FLOW_STREAM_BACKEND:-memory}
      NF_FLOW_OUTBOUND_BACKEND: ${NF_FLOW_OUTBOUND_BACKEND:-memory}
      NF_FLOW_AGENT_TICK_INTERVAL: ${NF_FLOW_AGENT_TICK_INTERVAL:-1m}
      NF_SECRET_KEY: ${NF_SECRET_KEY:-}
      NF_FLOW_DEFAULT_WORKSPACE_ID: ${NF_FLOW_DEFAULT_WORKSPACE_ID:-}
      # Shared secret consumed by flow-worker and presence-discord
      # when calling POST /signals or /internal/* lookup endpoints.
      # Empty disables every service-token path (see middleware
      # RequireSignalsAuth / RequireServiceTokenOnly).
      NF_FLOW_API_SIGNAL_TOKEN: ${NF_FLOW_API_SIGNAL_TOKEN:-}
      NF_FLOW_GH_WEBHOOK_SECRET: ${NF_FLOW_GH_WEBHOOK_SECRET:-}
      NF_FLOW_SLACK_SIGNING_SECRET: ${NF_FLOW_SLACK_SIGNING_SECRET:-}
      NF_FLOW_WEBHOOKS_INSECURE: ${NF_FLOW_WEBHOOKS_INSECURE:-true}
      NF_FLOW_AI_DAILY_BUDGET_CENTS: ${NF_FLOW_AI_DAILY_BUDGET_CENTS:-}
      NF_S3_ENDPOINT: ${NF_S3_ENDPOINT:-minio:9000}
      NF_S3_ACCESS_KEY: ${NF_S3_ACCESS_KEY:-minioadmin}
      NF_S3_SECRET_KEY: ${NF_S3_SECRET_KEY:-minioadmin}
      NF_S3_BUCKET: ${NF_S3_BUCKET:-nodate}
      NF_S3_USE_SSL: "false"
      NF_FLOW_SMTP_HOST: ${NF_FLOW_SMTP_HOST:-mailpit}
      NF_FLOW_SMTP_PORT: ${NF_FLOW_SMTP_PORT:-1025}
      NF_FLOW_SMTP_USERNAME: ${NF_FLOW_SMTP_USERNAME:-}
      NF_FLOW_SMTP_PASSWORD: ${NF_FLOW_SMTP_PASSWORD:-}
      NF_FLOW_SMTP_FROM: ${NF_FLOW_SMTP_FROM:-noreply@nodate-flow.local}
      # OTLP collector endpoint (gRPC). Traces and metrics are sent here.
      NF_FLOW_OTEL_ENDPOINT: ${NF_FLOW_OTEL_ENDPOINT:-otel-collector:4317}
      NF_FLOW_OTEL_INSECURE: ${NF_FLOW_OTEL_INSECURE:-true}
      NF_VERSION: ${NF_VERSION:-dev}
    ports:
      - "${NF_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  auth-api:
    build:
      context: .
      dockerfile: apps/auth-api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NF_AUTH_PORT: "8082"
      NF_AUTH_LOG_LEVEL: ${NF_AUTH_LOG_LEVEL:-info}
      NF_DB_DSN: ${NF_DB_DSN:-nodate:nodatepw@tcp(mysql:3306)/nodate_flow?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci&time_zone=%27%2B00%3A00%27}
      NF_COOKIE_SECURE: "false"
      NF_REGISTRATION_OPEN: ${NF_REGISTRATION_OPEN:-true}
      NF_AUTH_CORS: ${NF_AUTH_CORS:-http://localhost:5173,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5175}
      NF_AUTH_SESSION_STORE: ${NF_AUTH_SESSION_STORE:-mysql}
      NF_REDIS_ADDR: ${NF_REDIS_ADDR:-redis:6379}
      NF_AUTH_PUBLIC_URL: ${NF_AUTH_PUBLIC_URL:-http://localhost:8082}
      NF_AUTH_WEB_URL: ${NF_AUTH_WEB_URL:-http://localhost:5175}
      NF_AUTH_FLOW_WEB_URL: ${NF_AUTH_FLOW_WEB_URL:-http://localhost:5173}
      NF_SECRET_KEY: ${NF_SECRET_KEY:-}
      NF_S3_ENDPOINT: ${NF_S3_ENDPOINT:-minio:9000}
      NF_S3_ACCESS_KEY: ${NF_S3_ACCESS_KEY:-minioadmin}
      NF_S3_SECRET_KEY: ${NF_S3_SECRET_KEY:-minioadmin}
      NF_S3_BUCKET: ${NF_S3_BUCKET:-nodate}
      NF_S3_USE_SSL: "false"
      NF_AUTH_GOOGLE_CLIENT_ID: ${NF_AUTH_GOOGLE_CLIENT_ID:-}
      NF_AUTH_GOOGLE_CLIENT_SECRET: ${NF_AUTH_GOOGLE_CLIENT_SECRET:-}
      NF_AUTH_GITHUB_CLIENT_ID: ${NF_AUTH_GITHUB_CLIENT_ID:-}
      NF_AUTH_GITHUB_CLIENT_SECRET: ${NF_AUTH_GITHUB_CLIENT_SECRET:-}
      NF_AUTH_SLACK_CLIENT_ID: ${NF_AUTH_SLACK_CLIENT_ID:-}
      NF_AUTH_SLACK_CLIENT_SECRET: ${NF_AUTH_SLACK_CLIENT_SECRET:-}
      NF_AUTH_GOOGLE_INTEGRATION_CLIENT_ID: ${NF_AUTH_GOOGLE_INTEGRATION_CLIENT_ID:-}
      NF_AUTH_GOOGLE_INTEGRATION_CLIENT_SECRET: ${NF_AUTH_GOOGLE_INTEGRATION_CLIENT_SECRET:-}
      NF_AUTH_SMTP_HOST: ${NF_AUTH_SMTP_HOST:-mailpit}
      NF_AUTH_SMTP_PORT: ${NF_AUTH_SMTP_PORT:-1025}
      NF_AUTH_SMTP_USERNAME: ${NF_AUTH_SMTP_USERNAME:-}
      NF_AUTH_SMTP_PASSWORD: ${NF_AUTH_SMTP_PASSWORD:-}
      NF_AUTH_SMTP_FROM: ${NF_AUTH_SMTP_FROM:-noreply@nodate-flow.local}
    ports:
      - "${NF_AUTH_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Scheduled job runner (release-8 Phase 5, W1). Not started by default —
  # bring it up explicitly with `docker compose --profile worker up -d`.
  # Single-writer assumption for ticks: replicas is pinned at 1; horizontal
  # scaling requires a future leader-election layer.
  flow-worker:
    build:
      context: .
      dockerfile: apps/flow-worker/Dockerfile
    restart: unless-stopped
    profiles: ["worker"]
    deploy:
      replicas: 1
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NF_FLOW_WORKER_PORT: "9091"
      NF_FLOW_WORKER_LOG_LEVEL: ${NF_FLOW_WORKER_LOG_LEVEL:-info}
      NF_DB_DSN: ${NF_DB_DSN:-nodate:nodatepw@tcp(mysql:3306)/nodate_flow?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci&time_zone=%27%2B00%3A00%27}
      # flow-api service is named "api" inside this compose network.
      NF_FLOW_API_BASE_URL: ${NF_FLOW_API_BASE_URL:-http://api:8080}
      # Shared secret used by the worker to authenticate against
      # flow-api's POST /signals and /internal/* endpoints. Same env
      # var consumed by flow-api and presence-discord so one
      # operator-set value wires the whole worker fleet. Empty
      # disables every job that calls flow-api.
      NF_FLOW_API_SIGNAL_TOKEN: ${NF_FLOW_API_SIGNAL_TOKEN:-}
      # OTLP endpoint shared with flow-api. Empty disables tracing.
      NF_OTEL_EXPORTER_OTLP_ENDPOINT: ${NF_OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4318}
      NF_OTEL_INSECURE: ${NF_OTEL_INSECURE:-true}
      NF_FLOW_VERSION: ${NF_VERSION:-dev}
    # No ports published to the host. Prometheus scrapes :9091 over the
    # docker network; operators running multiple compose stacks would
    # collide on a host mapping.
    expose:
      - "9091"

  # Discord presence gateway (release-8 Phase 8, P8-3). Holds a single
  # Discord gateway WebSocket connection and translates presence updates
  # into signals POSTed to flow-api. Not started by default — bring it up
  # explicitly with `docker compose --profile presence-discord up -d`.
  # The Discord bot also requires GUILD_PRESENCES + GUILD_MEMBERS
  # privileged intents to be opted in via the Discord Developer Portal
  # (see docs/conventions/discord-bot-setup.md).
  #
  # No healthcheck: the gateway exposes no HTTP endpoint, and the
  # metrics listener only comes up after the WS session opens, so a
  # naive TCP probe on :9094 would be misleading.
  #
  # Single connection only — no replicas: directive (Compose v2 deploy
  # block is swarm-only anyway). Horizontal scaling would require
  # session shard coordination which is out of scope.
  presence-discord:
    build:
      context: .
      dockerfile: apps/presence-discord/Dockerfile
    restart: unless-stopped
    profiles: ["presence-discord"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NF_PRESENCE_LOG_LEVEL: ${NF_PRESENCE_LOG_LEVEL:-info}
      NF_PRESENCE_METRICS_ADDR: ":9094"
      NF_PRESENCE_DEBOUNCE_SECONDS: ${NF_PRESENCE_DEBOUNCE_SECONDS:-5}
      # Discord bot token. Empty by default — the gateway logs a clear
      # error and refuses to open the WS until set. Required env for
      # the profile to do anything useful.
      NF_DISCORD_BOT_TOKEN: ${NF_DISCORD_BOT_TOKEN:-}
      # flow-api service is named "api" inside this compose network.
      NF_FLOW_API_BASE_URL: ${NF_FLOW_API_BASE_URL:-http://api:8080}
      # Shared secret used to authenticate POST /signals and the
      # /internal/users/by-discord/{snowflake} lookup against flow-api.
      # Same env var consumed by flow-api and flow-worker so one
      # operator-set value covers every worker binary.
      NF_FLOW_API_SIGNAL_TOKEN: ${NF_FLOW_API_SIGNAL_TOKEN:-}
      # OTLP endpoint shared with flow-api / flow-worker. Empty
      # disables tracing.
      NF_OTEL_EXPORTER_OTLP_ENDPOINT: ${NF_OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4318}
      NF_OTEL_INSECURE: ${NF_OTEL_INSECURE:-true}
    # No ports published to the host. Prometheus scrapes :9094 over the
    # docker network when a scrape target is wired in (see
    # infra/prometheus/prometheus.yml).
    expose:
      - "9094"

volumes:
  mysql_data:
  minio_data:
  prometheus_data:
  grafana_data:
