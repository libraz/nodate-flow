# http-level definitions shared by every server block. Installed as a template
# so the framing policy for /embed/ can come from NF_EMBED_FRAME_ANCESTORS.

# One line per request: the path and nothing after it. Query strings (magic-link,
# OAuth and signed-blob tokens), Referer and User-Agent are not logged at all.
log_format edge '$remote_addr [$time_local] "$request_method $log_path" $status '
                '$body_bytes_sent $request_time';

# Path-segment tokens are masked. $uri carries no query and is the final
# internal URI, so an SPA route is logged as /index.html.
map $uri $log_path {
    ~^/(invite|share/cal|public/lenses|embed/cal)/[^/]+(.*)$ /$1/:token$2;
    default $uri;
}

# Only /embed/ is made to be framed by other sites. Keyed on the URL as
# received: a SPA route reaches index.html through an internal redirect.
map $request_uri $flow_frame_ancestors {
    ~^/embed/ "${NF_EMBED_FRAME_ANCESTORS}";
    default "'none'";
}

map $request_uri $flow_frame_options {
    ~^/embed/ "";
    default "DENY";
}

# An empty value is not sent.
map $scheme $hsts {
    https "max-age=31536000";
    default "";
}
