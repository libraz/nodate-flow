# What a SPA host serves. @APP@ is replaced at image build so each location
# includes its own app's headers (add_header in a location discards the
# server's). The including server sets root and the CSP hash.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/plain application/javascript application/json image/svg+xml;

# Vite fingerprints everything here, so it can be cached indefinitely.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/snippets/security-headers-@APP@.conf;
}

# index.html names the current build; cached, a deploy would keep serving the
# previous bundle's filenames.
location = /index.html {
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/snippets/security-headers-@APP@.conf;
}

# Client-side routing: any path that is not a built file answers index.html.
location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/conf.d/snippets/security-headers-@APP@.conf;
}
