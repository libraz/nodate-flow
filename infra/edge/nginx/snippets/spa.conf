# Locations for one SPA. Placeholders are replaced at image build: @APP@ picks
# the app's security headers (add_header in a location discards the server's),
# @PREFIX@ is its URL prefix (empty for the root app) and @ROOT@ the directory
# whose @PREFIX@ subdirectory holds the build.

# Vite fingerprints everything here, so it can be cached indefinitely.
location @PREFIX@/assets/ {
    root @ROOT@;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/snippets/security-headers-@APP@.conf;
}

# index.html names the current build; cached, a deploy would keep serving the
# previous bundle's filenames.
location = @PREFIX@/index.html {
    root @ROOT@;
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/snippets/security-headers-@APP@.conf;
}

# Client-side routing: any path that is not a built file answers index.html.
location @PREFIX@/ {
    root @ROOT@;
    try_files $uri $uri/ @PREFIX@/index.html;
    include /etc/nginx/conf.d/snippets/security-headers-@APP@.conf;
}
