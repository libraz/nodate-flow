# Sent with every file flow-web serves. Calls go to the API and auth origins.
# img-src allows https: for external avatar and public-share icon URLs. Only
# /embed/ may be framed (see $flow_frame_ancestors).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $spa_script_hash; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${NF_PUBLIC_SCHEME}://${NF_API_HOST} ${NF_PUBLIC_SCHEME}://${NF_AUTH_HOST}; img-src 'self' data: blob: https: ${NF_PUBLIC_SCHEME}://${NF_API_HOST} ${NF_PUBLIC_SCHEME}://${NF_AUTH_HOST}; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors $flow_frame_ancestors" always;
add_header X-Frame-Options $flow_frame_options always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security $hsts always;
