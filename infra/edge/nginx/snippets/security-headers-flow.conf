# Sent with every file flow-web serves. 'self' covers the API and auth paths.
# img-src allows https: for external avatar and public-share icon URLs. Only
# /embed/ may be framed (see $flow_frame_ancestors).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $spa_script_hash_flow; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data: blob: https:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors $flow_frame_ancestors" always;
add_header X-Frame-Options $flow_frame_options always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security $hsts always;
