# Included from inside a proxying location. The upstream address is set by the
# including snippet in $upstream.

# Resolved per request through Docker's DNS: a literal host in proxy_pass is
# looked up at startup, which fails if the API is not up yet and goes stale
# when it is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Replaces what the client sent: the API adopts this as its request id.
proxy_set_header X-Request-Id $request_id;

# The API sets its own response headers; only HSTS belongs to this hop.
add_header Strict-Transport-Security $hsts always;
