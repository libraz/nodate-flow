# Sent with every file accounts-web serves. $spa_script_hash comes from
# csp-accounts.conf, generated at image build. Styles allow 'unsafe-inline'
# because the UI sets style attributes. Calls go to the auth origin only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $spa_script_hash; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${NF_PUBLIC_SCHEME}://${NF_AUTH_HOST}; img-src 'self' data: blob: https: ${NF_PUBLIC_SCHEME}://${NF_AUTH_HOST}; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security $hsts always;
