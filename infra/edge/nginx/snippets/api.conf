# flow-api under /api/, prefix stripped; includes the SSE stream and /blobs.
location /api/ {
    set $upstream http://api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    include /etc/nginx/conf.d/snippets/proxy-common.conf;
    proxy_pass $upstream;

    # Attachments are accepted up to 100MiB, which is also the most a
    # Cloudflare Free or Pro zone forwards; the default 1MB would fail the
    # upload before the API can answer with its own limit.
    client_max_body_size 100m;

    # Streamed both ways, never staged on disk; also keeps SSE unbuffered.
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
