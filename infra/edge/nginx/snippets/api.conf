# flow-api, including the SSE stream and the /blobs relay.
location / {
    set $upstream http://api:8080;
    include /etc/nginx/conf.d/snippets/proxy-common.conf;
    proxy_pass $upstream;

    # Attachments are accepted up to 100MiB; the default 1MB would fail the
    # upload before the API can answer with its own limit.
    client_max_body_size 128m;

    # Streamed both ways, never staged on disk; also keeps SSE unbuffered.
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
