# OpenTelemetry Collector configuration for local development.
# Run with: docker run --rm -p 4317:4317 -p 4318:4318 -v $(pwd)/infra/otel/config.yaml:/etc/otelcol/config.yaml otel/opentelemetry-collector-contrib:latest

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
