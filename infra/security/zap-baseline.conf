# ZAP Baseline Scan Configuration for nodate-flow
# https://www.zaproxy.org/docs/docker/baseline-scan/
#
# Usage:
#   docker run --rm -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
#     -t http://localhost:8787 \
#     -c zap-baseline.conf \
#     -J zap-report.json
#
# Target: NF_API_URL (default http://localhost:8787)

# Maximum scan duration in minutes
-m 10

# Exclude health and metrics endpoints from scanning
-r ^/healthz$
-r ^/readyz$
-r ^/metrics$
-r ^/debug/

# Disable active scanning (baseline only, passive rules)
-a

# Generate JSON report
-J zap-report.json

# Alert threshold: FAIL on Medium and above
-l WARN

# Rules configuration
# 10003 - Vulnerable JS Library: IGNORE (dev-only static assets)
10003	IGNORE
# 10015 - Re-examine Cache-control Directives: IGNORE (API-only, no browser caching concern)
10015	IGNORE
# 10049 - Storable and Cacheable Content: IGNORE (API responses use Cache-Control: no-store)
10049	IGNORE
# 10096 - Timestamp Disclosure: IGNORE (API returns timestamps by design)
10096	IGNORE
# 10109 - Modern Web Application: IGNORE (API server, not a web app)
10109	IGNORE

# CSP - Content Security Policy: WARN (API-only, CSP is for web app)
10038	WARN
# X-Content-Type-Options - WARN (should be set, but not critical for API)
10021	WARN
# Anti-CSRF Tokens - IGNORE (API uses JWT, not CSRF tokens)
10202	IGNORE
