global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: nodate-flow-api
    static_configs:
      - targets:
          - api:8080
    metrics_path: /metrics

  - job_name: nodate-auth-api
    static_configs:
      - targets:
          - auth-api:8082
    metrics_path: /metrics

  - job_name: nodate-time-api
    static_configs:
      - targets:
          - time-api:8081
    metrics_path: /metrics

  # Scrape OTLP metrics exported by the OTel Collector.
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
