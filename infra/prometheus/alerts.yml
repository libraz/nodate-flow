groups:
  - name: nodate-flow-api
    rules:
      # HighErrorRate: 5xx error rate exceeds 5% of total requests over 5 minutes.
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(nf_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(nf_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate"
          description: >-
            5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes
            (threshold: 5%).

      # HighP95Latency: HTTP p95 latency exceeds 2 seconds over 5 minutes.
      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(nf_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP p95 latency"
          description: >-
            p95 latency is {{ $value | humanizeDuration }}
            (threshold: 2s).

      # HighP99Latency: HTTP p99 latency exceeds 5 seconds over 5 minutes.
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(nf_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP p99 latency"
          description: >-
            p99 latency is {{ $value | humanizeDuration }}
            (threshold: 5s).

  - name: nodate-flow-ai
    rules:
      # AICostSpike: AI spending rate exceeds $10/hour.
      - alert: AICostSpike
        expr: |
          sum(rate(nf_ai_cost_dollars_total[5m])) * 3600 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI cost spike detected"
          description: >-
            AI spending rate is ${{ $value | printf "%.2f" }}/hour
            (threshold: $10/hour).

      # HighAIErrorRate: AI invocation error rate exceeds 10% over 5 minutes.
      - alert: HighAIErrorRate
        expr: |
          (
            sum(rate(nf_ai_invocations_total{outcome="error"}[5m]))
            /
            sum(rate(nf_ai_invocations_total[5m]))
          ) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High AI invocation error rate"
          description: >-
            AI error rate is {{ $value | humanizePercentage }} over the last 5 minutes
            (threshold: 10%).

  - name: nodate-audit
    rules:
      # AuditWriteLoss: audit rows the recorder built but could not store.
      # An audit write never fails the request that triggered it, so this
      # counter is the only sign that a service answered 2xx for an action
      # that left no trace. The loss is unrecoverable — nothing retries the
      # row — which is why any increase alerts rather than a rate threshold.
      - alert: AuditWriteLoss
        expr: |
          sum by (job, table) (increase(nf_audit_write_failures_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Audit trail incomplete on {{ $labels.job }}"
          description: >-
            {{ $labels.job }} failed to store {{ $value | printf "%.0f" }}
            {{ $labels.table }} row(s) in the last 15 minutes. Those actions
            succeeded and were answered 2xx, but no audit record exists for
            them and none will be written retroactively; correlate with
            nf_db_queries_total{status="error"} to confirm the cause.

  - name: nodate-flow-infra
    rules:
      # ServiceDown: a service metrics target answered at some point in the
      # last hour and has now been unreachable for 1 minute. The second
      # condition is what separates "down" from "not deployed": a target
      # that has never been reachable is a service this instance does not
      # run, and alerting on it would leave the rule permanently red. The
      # job matcher covers every nodate-* service and excludes the
      # otel-collector target, which is infrastructure rather than a
      # service.
      #
      # The window is the price of having no deployment inventory to check
      # against. One hour means a service stopped deliberately goes quiet
      # within the hour instead of staying red, and in exchange an outage
      # lasting longer than an hour resolves itself here — by which point
      # it has been paging for an hour and is no longer news.
      - alert: ServiceDown
        expr: |
          up{job=~"nodate-.*"} == 0
          and
          max_over_time(up{job=~"nodate-.*"}[1h]) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: >-
            The metrics target {{ $labels.instance }} for job
            {{ $labels.job }} has been unreachable for more than 1 minute.
