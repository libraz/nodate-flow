version: "2"
run:
  go: "1.26"
  # golangci-lint runs once per module, from inside that module, so an
  # issue path is module-relative by default and a rule written against
  # the repository layout never matches. gitroot restates every path from
  # the repository root, which is the one spelling that is the same for
  # all six modules and the only one that can tell apps/flow-api/internal
  # apart from apps/auth-api/internal.
  relative-path-mode: gitroot
issues:
  # Defaults are 50 per linter and 3 per identical message, which silently
  # truncates a report. A guard whose output stops at three lines cannot
  # be counted or trusted.
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - gosec
    - govet
    - revive
    - staticcheck
  settings:
    depguard:
      # depguard matches `files` against the absolute path of the file
      # under analysis, so the module a file belongs to is readable from
      # the path itself and each application keeps its own allowlist.
      # Every module is covered: the two applications by name, everything
      # else by the closing rule below.
      rules:
        crypto-flow-api:
          list-mode: lax
          files:
            - '**/apps/flow-api/**'
            - '!**/apps/flow-api/internal/ai/**'
            - '!**/apps/flow-api/internal/http/handlers/ai/**'
            - '!**/apps/flow-api/internal/http/router/**'
            - '!**/apps/flow-api/cmd/secrets-rotate/**'
            - '!**/apps/flow-api/cmd/api/**'
            - '!**/apps/flow-api/tests/**'
          deny:
            - pkg: github.com/libraz/nodate-flow/packages/go-shared/crypto
              desc: crypto package may only be imported from internal/ai, internal/http/handlers/ai, internal/http/router, cmd/api, cmd/secrets-rotate, and tests
        crypto-auth-api:
          list-mode: lax
          files:
            - '**/apps/auth-api/**'
            - '!**/apps/auth-api/internal/http/handlers/auth/**'
            - '!**/apps/auth-api/internal/http/handlers/integrations/**'
            - '!**/apps/auth-api/internal/http/router/**'
            - '!**/apps/auth-api/internal/integrations/**'
            - '!**/apps/auth-api/cmd/api/**'
            - '!**/apps/auth-api/tests/**'
            - '!**/apps/auth-api/testutil/**'
          deny:
            - pkg: github.com/libraz/nodate-flow/packages/go-shared/crypto
              desc: crypto package may only be imported from internal/http/handlers/auth, internal/http/handlers/integrations, internal/http/router, internal/integrations, cmd/api, testutil, and tests
        # The remaining modules — flow-worker, presence-discord, scripts
        # and the rest of go-shared — hold no secret material and none of
        # them imports crypto today. They get no allowance, so the first
        # import that appears has to argue for itself. go-shared/crypto is
        # the package being guarded and is exempt from its own rule.
        crypto-elsewhere:
          list-mode: lax
          files:
            - '!**/apps/flow-api/**'
            - '!**/apps/auth-api/**'
            - '!**/packages/go-shared/crypto/**'
          deny:
            - pkg: github.com/libraz/nodate-flow/packages/go-shared/crypto
              desc: crypto belongs to the services that hold secret material; a module that needs it states the boundary in this file first
    forbidigo:
      # Patterns are matched against the callee name ALONE. forbidigo has
      # no view of call arguments — analyze-types buys package resolution,
      # not argument text — so a pattern naming an attr key can never fire.
      # The earlier rules did exactly that and were dead from the day they
      # were written.
      #
      # The constructors are therefore banned outright and the two
      # legitimate shapes get named helpers: logutil.LogEntity for
      # identity, logutil.LogNumber for counts, sizes, durations and
      # status codes. logutil.LogNumber redacts id-shaped keys so it
      # cannot be used to smuggle the ban back open.
      #
      # This rule is a nudge for the author, not the boundary. It cannot
      # see slog.Any("workspace_id", ws.ID) nor the loose
      # logger.Warn(msg, "workspace_id", id) form; logutil.RedactHandler
      # suppresses those at the sink.
      forbid:
        - pattern: ^slog\.Int$
          msg: use logutil.LogEntity for ids or logutil.LogNumber for counts; convention 18
        - pattern: ^slog\.Int64$
          msg: use logutil.LogEntity for ids or logutil.LogNumber for counts; convention 18
        - pattern: ^slog\.Uint64$
          msg: use logutil.LogEntity for ids or logutil.LogNumber for counts; convention 18
      analyze-types: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Background pipelines that still log internal ids because their
      # call sites hold no public id and reaching one needs a query
      # change. The values do not leave the process — RedactHandler
      # replaces them with [REDACTED:internal-id] — so what remains here
      # is unconverted call sites, not live leaks. 90 sites: ai/signaljudge
      # 41, notification 20, ai/agentruntime 9, webhook 8, importer 7,
      # storagegc 3, eventbus 2. Shrink this list, never grow it.
      - path: ^apps/flow-api/internal/(ai|notification|webhook|importer|storagegc|eventbus)/
        linters:
          - forbidigo
      # logutil owns the ban: LogNumber wraps the forbidden constructor
      # and RedactHandler is what makes the loose forms harmless. Its
      # tests have to build slog.Int / Int64 / Uint64 attrs directly,
      # because an attr routed through the helper is not the input those
      # tests exist to feed the handler.
      - path: ^packages/go-shared/logutil/
        linters:
          - forbidigo
    paths:
      - ^apps/flow-api/internal/db/generated/
      - ^apps/flow-api/internal/errors/
      - ^apps/flow-api/internal/signalkinds/
      - ^apps/auth-api/internal/db/generated/
      - ^apps/auth-api/internal/errors/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ^apps/flow-api/internal/db/generated/
      - ^apps/flow-api/internal/errors/
      - ^apps/flow-api/internal/signalkinds/
      - ^apps/auth-api/internal/db/generated/
      - ^apps/auth-api/internal/errors/
      - third_party$
      - builtin$
      - examples$
