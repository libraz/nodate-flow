# External feed signals — observations sourced from non-chat third-party
# providers that the worker polls or that webhooks deliver.
#
# Workspace-scoped subjects (rather than user-scoped) because these are
# environmental rather than personal observations.

kinds:
  - kind: weather.condition
    source: weather
    retention: stateful
    autonomy_default: suggest
    subject_type_default: workspace
    description: "Current weather observation for a workspace location"
    i18n_key: signalKinds.weather.condition

  - kind: stock.price_threshold
    source: stock
    retention: discrete
    autonomy_default: suggest
    subject_type_default: workspace
    description: "Stock ticker crossed a configured threshold"
    i18n_key: signalKinds.stock.priceThreshold
