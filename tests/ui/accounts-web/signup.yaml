# Scenario — open accounts-web /signup, submit a unique account, and assert
# POST /auth/register returned 200.
#
# Uses a fixed smoke email so re-runs without DB reset will fail with
# email_taken. Reset the auth DB between runs or change the email var.

version: 1
app: accounts-web
base_url: http://localhost:5175

suites:
  - id: signup
    area: auth
    severity_on_fail: high
    description: >
      Open accounts-web /signup, submit a fresh display name / email /
      password triplet, and assert POST /auth/register returned 200
      with a clean console.
    cases:
      - id: happy_ja
        vars:
          locale: ja
          accounts_url: http://localhost:5175
          display_name: ui-verify smoke user
          email: ui-verify-smoke-001@example.test
          password: smoke-password-001

    steps:
      - id: open_signup
        action:
          tool: new_page
          args:
            url: "${accounts_url}/signup"

      - id: resize_desktop
        action:
          tool: resize_page
          args: { width: 1280, height: 800 }

      - id: snapshot_signup
        action:
          tool: take_snapshot
          args: {}

      - id: fill_display_name
        action:
          tool: fill
          resolve: { by: name, match: "^(Display name|表示名)$" }
          args:
            value: "${display_name}"

      - id: fill_email
        action:
          tool: fill
          resolve: { by: name, match: "^(Email|メールアドレス)$" }
          args:
            value: "${email}"

      - id: fill_password
        action:
          tool: fill
          resolve: { by: name, match: "^(Password|パスワード)$" }
          args:
            value: "${password}"

      - id: submit_signup
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "^(Create account|アカウント作成)$" }

      - kind: check
        id: register_200
        note: The last POST to /auth/register should have returned 200.
        action:
          tool: list_network_requests
          args: { resourceTypes: ["xhr", "fetch"] }
        assert:
          type: status
          method: POST
          path: /auth/register
          status: 200

      - id: wait_post_signup
        note: Successful signup lands the user on the profile or workspaces surface.
        action:
          tool: wait_for
          args:
            text: ["Profile", "プロフィール", "Workspaces", "ワークスペース"]

      - kind: check
        id: console_clean
        action:
          tool: list_console_messages
          args: { types: ["error", "warn"] }
        assert:
          type: empty_array
