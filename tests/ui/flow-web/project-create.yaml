# Scenario — log in, visit the Demo Workspace projects tab, open the create-project
# dialog, submit a new project, and assert POST /workspaces/{wsId}/projects returned 200.
#
# Leaves one project behind in the target workspace — acceptable artifact until a
# teardown step lands later.

version: 1
app: flow-web
base_url: http://localhost:5173

suites:
  - id: project_create
    area: projects
    severity_on_fail: high
    description: >
      Log in, land on the Demo Workspace projects tab, open the
      create-project dialog, submit a unique project, and assert
      POST /workspaces/{wsId}/projects returned 200.
    cases:
      - id: happy_ja
        vars:
          locale: ja
          accounts_url: http://localhost:5175
          flow_url: http://localhost:5173
          email: admin@example.com
          password: password123
          workspace_name: Demo Workspace
          project_name: ui-verify smoke project
          project_slug: ui-verify-smoke
          project_identifier: UVSMK

    steps:
      - id: open_accounts_login
        action:
          tool: new_page
          args:
            url: "${accounts_url}/login"

      - id: resize_desktop
        action:
          tool: resize_page
          args: { width: 1280, height: 800 }

      - id: snapshot_login
        action:
          tool: take_snapshot
          args: {}

      - id: fill_email
        action:
          tool: fill
          resolve: { by: name, match: email }
          args:
            value: "${email}"

      - id: fill_password
        action:
          tool: fill
          resolve: { by: name, match: password }
          args:
            value: "${password}"

      - id: submit_login
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "(Sign in|サインイン)" }

      - id: wait_workspaces
        action:
          tool: wait_for
          args:
            text: ["Workspaces", "ワークスペース"]

      - id: goto_workspaces
        action:
          tool: navigate_page
          args:
            url: "${flow_url}/workspaces"

      - id: snapshot_workspaces
        action:
          tool: take_snapshot
          args: {}

      - id: click_target_workspace
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^${workspace_name}$" }

      - id: wait_workspace_landed
        action:
          tool: wait_for
          args:
            text: ["${workspace_name}"]

      - id: click_projects_tab
        note: Workspace lands on Overview; navigate to the Projects tab where the CTA lives.
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^(Projects|プロジェクト)$" }

      - id: wait_projects_tab
        action:
          tool: wait_for
          args:
            text: ["New project", "プロジェクトを作成"]

      - id: snapshot_workspace
        action:
          tool: take_snapshot
          args: {}

      - id: click_new_project
        note: Open the create-project dialog via the primary CTA.
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "^(New project|プロジェクトを作成)$" }

      - id: snapshot_dialog
        action:
          tool: take_snapshot
          args: {}

      - id: fill_project_name
        action:
          tool: fill
          resolve: { by: name, match: "^(Name|名前)$" }
          args:
            value: "${project_name}"

      - id: fill_project_identifier
        note: The 5-char uppercase identifier. Slug is auto-derived from name.
        action:
          tool: fill
          resolve: { by: name, match: "^(Identifier|識別子)$" }
          args:
            value: "${project_identifier}"

      - id: submit_project
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "^(Save|保存|Create|作成)$" }

      - kind: check
        id: project_create_200
        note: The last POST to /workspaces/{wsId}/projects should have returned 200 (Huma default).
        action:
          tool: list_network_requests
          args: { resourceTypes: ["xhr", "fetch"] }
        assert:
          type: status
          method: POST
          path: /projects
          status: 200

      - kind: check
        id: console_clean
        action:
          tool: list_console_messages
          args: { types: ["error", "warn"] }
        assert:
          type: empty_array
