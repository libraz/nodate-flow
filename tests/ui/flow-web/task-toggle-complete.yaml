# Scenario — log in, open a task from /today, click Complete on the detail page,
# and assert POST /tasks/{id}/transitions returned 200.

version: 1
app: flow-web
base_url: http://localhost:5173

suites:
  - id: task_toggle_complete
    area: tasks
    severity_on_fail: high
    description: >
      Log in, navigate to /today, click the first task link, land on the
      task detail page, click the Complete transition, and assert
      POST /tasks/{id}/transitions returned 200 with a clean console.
      Relies on the seed having at least one open task assigned to admin.
    cases:
      - id: happy_ja
        vars:
          locale: ja
          accounts_url: http://localhost:5175
          flow_url: http://localhost:5173
          email: admin@example.com
          password: password123
          workspace_name: Demo Workspace

    steps:
      - id: open_accounts_login
        action:
          tool: new_page
          args:
            url: "${accounts_url}/login"

      - id: resize_desktop
        action:
          tool: resize_page
          args: { width: 1280, height: 800 }

      - id: snapshot_login
        action:
          tool: take_snapshot
          args: {}

      - id: fill_email
        action:
          tool: fill
          resolve: { by: name, match: email }
          args:
            value: "${email}"

      - id: fill_password
        action:
          tool: fill
          resolve: { by: name, match: password }
          args:
            value: "${password}"

      - id: submit_login
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "(Sign in|サインイン)" }

      - id: wait_workspaces
        action:
          tool: wait_for
          args:
            text: ["Workspaces", "ワークスペース"]

      - id: goto_workspaces
        action:
          tool: navigate_page
          args:
            url: "${flow_url}/workspaces"

      - id: snapshot_workspaces
        action:
          tool: take_snapshot
          args: {}

      - id: click_target_workspace
        note: Prime the active workspace so /today has context.
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^${workspace_name}$" }

      - id: wait_workspace_landed
        action:
          tool: wait_for
          args:
            text: ["${workspace_name}"]

      - id: goto_today
        action:
          tool: navigate_page
          args:
            url: "${flow_url}/today"

      - id: snapshot_today
        action:
          tool: take_snapshot
          args: {}

      - id: open_first_task
        note: Follow the first task link under any section. Title is seed-specific so match by task-row link shape.
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^(?!.*(Workspaces|ワークスペース|Inbox|受信トレイ|Calendar|カレンダー|Pages|ページ|Projects|プロジェクト|Settings|設定)$).+$" }

      - id: wait_task_detail
        action:
          tool: wait_for
          args:
            text: ["Activity", "アクティビティ"]

      - id: snapshot_task_detail
        action:
          tool: take_snapshot
          args: {}

      - id: click_complete
        note: Trigger the Complete transition from the detail page transition list.
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "^(Complete|完了)$" }

      - kind: check
        id: transition_200
        note: The last POST to /tasks/{id}/transitions should have returned 200.
        action:
          tool: list_network_requests
          args: { resourceTypes: ["xhr", "fetch"] }
        assert:
          type: status
          method: POST
          path: /transitions
          status: 200

      - kind: check
        id: console_clean
        action:
          tool: list_console_messages
          args: { types: ["error", "warn"] }
        assert:
          type: empty_array
