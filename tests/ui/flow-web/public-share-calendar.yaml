# Scenario — log in, create a public share page in the Demo Workspace, copy the
# revealed URL from the create dialog, visit it from a fresh (unauthenticated)
# navigation, and assert the share renders with a clean console.
#
# Public share URLs are capability tokens — anyone with the URL can view the page.
# Leaves one share page behind in the target workspace — acceptable artifact
# until a teardown step lands later.

version: 1
app: flow-web
base_url: http://localhost:5173

suites:
  - id: public_share_calendar
    area: sharing
    severity_on_fail: high
    description: >
      Log in, create a public share page in Demo Workspace, capture the
      revealed URL, open it anonymously in a new page, and assert the
      public share renders with a clean console.
    cases:
      - id: happy_ja
        vars:
          locale: ja
          accounts_url: http://localhost:5175
          flow_url: http://localhost:5173
          email: admin@example.com
          password: password123
          workspace_name: Demo Workspace
          share_title: ui-verify smoke share

    steps:
      - id: open_accounts_login
        action:
          tool: new_page
          args:
            url: "${accounts_url}/login"

      - id: resize_desktop
        action:
          tool: resize_page
          args: { width: 1280, height: 800 }

      - id: snapshot_login
        action:
          tool: take_snapshot
          args: {}

      - id: fill_email
        action:
          tool: fill
          resolve: { by: name, match: email }
          args:
            value: "${email}"

      - id: fill_password
        action:
          tool: fill
          resolve: { by: name, match: password }
          args:
            value: "${password}"

      - id: submit_login
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "(Sign in|サインイン)" }

      - id: wait_workspaces
        action:
          tool: wait_for
          args:
            text: ["Workspaces", "ワークスペース"]

      - id: goto_workspaces
        action:
          tool: navigate_page
          args:
            url: "${flow_url}/workspaces"

      - id: snapshot_workspaces
        action:
          tool: take_snapshot
          args: {}

      - id: click_target_workspace
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^${workspace_name}$" }

      - id: wait_workspace_landed
        action:
          tool: wait_for
          args:
            text: ["${workspace_name}"]

      - id: click_settings_tab
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^(Settings|設定)$" }

      - id: click_public_shares_nav
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^(Public share pages|公開シェアページ)$" }

      - id: wait_shares_title
        action:
          tool: wait_for
          args:
            text: ["Public share pages", "公開シェアページ"]

      - id: snapshot_shares
        action:
          tool: take_snapshot
          args: {}

      - id: click_create_share
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "^(Create share|シェアを作成)$" }

      - id: snapshot_create_dialog
        action:
          tool: take_snapshot
          args: {}

      - id: fill_share_title
        action:
          tool: fill
          resolve: { by: name, match: "^(Title|タイトル)$" }
          args:
            value: "${share_title}"

      - id: submit_share
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "^(Create|作成)$" }

      - kind: check
        id: share_create_200
        note: The last POST to /public-shares should have returned 200.
        action:
          tool: list_network_requests
          args: { resourceTypes: ["xhr", "fetch"] }
        assert:
          type: status
          method: POST
          path: /public-shares
          status: 200

      - id: snapshot_reveal_dialog
        note: The reveal dialog shows the share URL once.
        action:
          tool: take_snapshot
          args: {}

      - id: extract_share_url
        note: >
          Capture the revealed share URL into window.__sharedUrl so the next
          step can navigate to it. The URL token is single-view; this script
          reads it directly from the DOM input labeled "Share URL".
        action:
          tool: evaluate_script
          args:
            function: |
              () => {
                const inputs = Array.from(document.querySelectorAll('input'));
                const match = inputs.find((el) => typeof el.value === 'string' && el.value.includes('/share/cal/'));
                if (!match) return null;
                window.__sharedUrl = match.value;
                return match.value;
              }

      - id: open_share_anonymously
        note: >
          Open the captured URL in a fresh page so the share is hit without
          the workspace session cookie.
        action:
          tool: evaluate_script
          args:
            function: |
              () => {
                if (!window.__sharedUrl) return null;
                window.open(window.__sharedUrl, '_blank');
                return window.__sharedUrl;
              }

      - id: wait_share_render
        note: Wait for the nodate-flow brand header on the public share.
        action:
          tool: wait_for
          args:
            text: ["nodate-flow"]

      - id: snapshot_public_share
        action:
          tool: take_snapshot
          args: {}

      - kind: check
        id: console_clean
        action:
          tool: list_console_messages
          args: { types: ["error", "warn"] }
        assert:
          type: empty_array
