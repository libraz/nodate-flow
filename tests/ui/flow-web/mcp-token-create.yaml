# Scenario — log in, enter the Demo Workspace MCP tokens settings, create a token,
# and assert POST /workspaces/{wsId}/me/mcp-tokens returned 200 with the token reveal
# dialog visible. The issued token is shown once and is not captured in this test —
# the assertion is shape-only.

version: 1
app: flow-web
base_url: http://localhost:5173

suites:
  - id: mcp_token_create
    area: settings
    severity_on_fail: medium
    description: >
      Log in, land on the Demo Workspace MCP tokens settings, open the
      create-token dialog, submit a named token, and assert the create
      endpoint returned 200.
    cases:
      - id: happy_ja
        vars:
          locale: ja
          accounts_url: http://localhost:5175
          flow_url: http://localhost:5173
          email: admin@example.com
          password: password123
          workspace_name: Demo Workspace
          token_name: ui-verify smoke token

    steps:
      - id: open_accounts_login
        action:
          tool: new_page
          args:
            url: "${accounts_url}/login"

      - id: resize_desktop
        action:
          tool: resize_page
          args: { width: 1280, height: 800 }

      - id: snapshot_login
        action:
          tool: take_snapshot
          args: {}

      - id: fill_email
        action:
          tool: fill
          resolve: { by: name, match: email }
          args:
            value: "${email}"

      - id: fill_password
        action:
          tool: fill
          resolve: { by: name, match: password }
          args:
            value: "${password}"

      - id: submit_login
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "(Sign in|サインイン)" }

      - id: wait_workspaces
        action:
          tool: wait_for
          args:
            text: ["Workspaces", "ワークスペース"]

      - id: goto_workspaces
        action:
          tool: navigate_page
          args:
            url: "${flow_url}/workspaces"

      - id: snapshot_workspaces
        action:
          tool: take_snapshot
          args: {}

      - id: click_target_workspace
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^${workspace_name}$" }

      - id: wait_workspace_landed
        action:
          tool: wait_for
          args:
            text: ["${workspace_name}"]

      - id: click_settings_tab
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^(Settings|設定)$" }

      - id: snapshot_settings
        action:
          tool: take_snapshot
          args: {}

      - id: click_mcp_tokens_nav
        action:
          tool: click
          resolve: { by: role_name, role: link, match: "^(MCP tokens|MCP トークン)$" }

      - id: wait_mcp_tokens_title
        action:
          tool: wait_for
          args:
            text: ["MCP tokens", "MCP トークン"]

      - id: snapshot_mcp_tokens
        action:
          tool: take_snapshot
          args: {}

      - id: click_create_token
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "^(Create token|トークンを作成)$" }

      - id: snapshot_dialog
        action:
          tool: take_snapshot
          args: {}

      - id: fill_token_name
        action:
          tool: fill
          resolve: { by: name, match: "^(Name|名前)$" }
          args:
            value: "${token_name}"

      - id: submit_token
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "^(Create|作成)$" }

      - kind: check
        id: mcp_token_create_200
        note: The last POST to /mcp-tokens should have returned 200.
        action:
          tool: list_network_requests
          args: { resourceTypes: ["xhr", "fetch"] }
        assert:
          type: status
          method: POST
          path: /mcp-tokens
          status: 200

      - kind: check
        id: console_clean
        action:
          tool: list_console_messages
          args: { types: ["error", "warn"] }
        assert:
          type: empty_array
