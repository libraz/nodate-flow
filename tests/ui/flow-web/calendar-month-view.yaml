# Scenario — log in, visit /calendar, confirm the month view renders with a clean console.

version: 1
app: flow-web
base_url: http://localhost:5173

suites:
  - id: calendar_month_view
    area: calendar
    severity_on_fail: high
    description: >
      Log in via accounts-web, navigate to flow-web /calendar, wait for
      the Calendar heading to render in either locale, and assert a
      clean console across the full flow.
    cases:
      - id: happy_ja
        vars:
          locale: ja
          accounts_url: http://localhost:5175
          flow_url: http://localhost:5173
          email: admin@example.com
          password: password123

    steps:
      - id: open_accounts_login
        action:
          tool: new_page
          args:
            url: "${accounts_url}/login"

      - id: resize_desktop
        action:
          tool: resize_page
          args: { width: 1280, height: 800 }

      - id: snapshot_login
        action:
          tool: take_snapshot
          args: {}

      - id: fill_email
        action:
          tool: fill
          resolve: { by: name, match: email }
          args:
            value: "${email}"

      - id: fill_password
        action:
          tool: fill
          resolve: { by: name, match: password }
          args:
            value: "${password}"

      - id: submit_login
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "(Sign in|サインイン)" }

      - id: wait_workspaces
        action:
          tool: wait_for
          args:
            text: ["Workspaces", "ワークスペース"]

      - id: goto_calendar
        action:
          tool: navigate_page
          args:
            url: "${flow_url}/calendar"

      - id: wait_calendar_title
        note: Wait for the Calendar heading to land in either locale.
        action:
          tool: wait_for
          args:
            text: ["Calendar", "カレンダー"]

      - id: snapshot_calendar
        action:
          tool: take_snapshot
          args: {}

      - kind: check
        id: console_clean
        note: No runtime errors or warnings across the full flow.
        action:
          tool: list_console_messages
          args: { types: ["error", "warn"] }
        assert:
          type: empty_array
