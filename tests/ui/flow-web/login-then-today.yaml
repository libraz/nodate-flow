# Scenario — log in via accounts-web, land on flow-web /today, assert a clean console.

version: 1
app: flow-web
base_url: http://localhost:5173

suites:
  - id: login_then_today
    area: auth
    severity_on_fail: high
    description: Log in via accounts-web, land on flow-web /today, assert a clean console.
    # Single-case demo. Extend `cases` once a matrix is worth exercising.
    cases:
      - id: happy_ja
        vars:
          locale: ja
          accounts_url: http://localhost:5175
          flow_url: http://localhost:5173
          email: admin@example.com
          password: password123

    steps:
      - id: open_accounts_login
        note: Open the accounts-web login page.
        action:
          tool: new_page
          args:
            url: "${accounts_url}/login"

      - id: resize_desktop
        note: Desktop viewport — 1280x800.
        action:
          tool: resize_page
          args: { width: 1280, height: 800 }

      - id: snapshot_login
        note: Capture a11y snapshot to find the email/password inputs.
        action:
          tool: take_snapshot
          args: {}

      - id: fill_email
        note: Fill the email field. Resolve uid from the latest snapshot.
        action:
          tool: fill
          resolve: { by: name, match: email }
          args:
            value: "${email}"

      - id: fill_password
        note: Fill the password field. Resolve uid from the latest snapshot.
        action:
          tool: fill
          resolve: { by: name, match: password }
          args:
            value: "${password}"

      - id: submit_login
        note: Submit the form. Resolve uid via the submit button.
        action:
          tool: click
          resolve: { by: role_name, role: button, match: "(Sign in|サインイン)" }

      - id: wait_workspaces
        note: Wait until the workspace picker is visible.
        action:
          tool: wait_for
          args:
            text: ["Workspaces", "ワークスペース"]

      - id: goto_today
        note: Navigate to flow-web /today.
        action:
          tool: navigate_page
          args:
            url: "${flow_url}/today"

      - id: snapshot_today
        note: Snapshot the landing page for assertion.
        action:
          tool: take_snapshot
          args: {}

      - kind: check
        id: console_clean
        note: Console must have zero errors or warnings across the full flow.
        action:
          tool: list_console_messages
          args: { types: ["error", "warn"] }
        assert:
          type: empty_array
