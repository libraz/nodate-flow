# Reserved: handlers not yet implemented
# TODO: NOTIFICATION.NOTIFICATION.NOT_FOUND overlaps semantically with
# WS.NOTIFICATION.NOT_FOUND (ws.yaml). When notification handlers are
# implemented, disambiguate: WS.NOTIFICATION covers workspace-scoped
# in-app notifications; this domain covers cross-channel delivery.
domain: notification
breadcrumb: "Notification"

resources:
  notification:
    breadcrumb: "Notification"
    errors:
      not_found:
        code: NOTIFICATION.NOTIFICATION.NOT_FOUND
        status: 404
        message: "Notification not found"
        description: "Returned when a notification with the given public_id does not exist or the actor does not have access to it."
        userAction: "Verify the notification ID, or refresh the list to see current notifications."

      already_read:
        code: NOTIFICATION.NOTIFICATION.ALREADY_READ
        status: 409
        message: "Notification has already been marked as read"
        description: "Returned when attempting to mark a notification as read that has already been read."
        userAction: "No action needed; the notification is already in the read state."

      already_archived:
        code: NOTIFICATION.NOTIFICATION.ALREADY_ARCHIVED
        status: 409
        message: "Notification has already been archived"
        description: "Returned when attempting to archive a notification that has already been archived."
        userAction: "No action needed; the notification is already archived."

  delivery:
    breadcrumb: "Notification > Delivery"
    errors:
      channel_unreachable:
        code: NOTIFICATION.DELIVERY.CHANNEL_UNREACHABLE
        status: 500
        message: "Notification delivery channel is unreachable"
        description: "Returned when the server fails to deliver a notification via email or push because the delivery channel is unavailable or returned an error."
        userAction: "Retry in a moment; contact your administrator if the problem persists."
