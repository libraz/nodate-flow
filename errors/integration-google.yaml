domain: integration_google
breadcrumb: "Integration > Google"

resources:
  webhook:
    breadcrumb: "Integration > Google > Webhook"
    errors:
      invalid_token:
        code: INTEGRATION.GOOGLE.WEBHOOK_INVALID_TOKEN
        status: 401
        message: "Google push channel token verification failed"
        message_ja: "Google プッシュチャネルのトークン検証に失敗しました"
        message_zh: "Google 推送通道令牌验证失败"
        description: "Returned when the X-Goog-Channel-Token header does not match the expected channel token configured for the integration."
        userAction: "Verify that the channel token matches the one registered during push notification setup."

      payload_unparseable:
        code: INTEGRATION.GOOGLE.WEBHOOK_PAYLOAD_UNPARSEABLE
        status: 400
        message: "Google push notification body could not be read"
        message_ja: "Google プッシュ通知の本文を読み取れませんでした"
        message_zh: "无法读取 Google 推送通知的正文"
        description: "Returned when the Google push notification body cannot be read, including a body larger than the 1 MiB limit."
        userAction: "Check the Google push channel configuration; the notification body must be under 1 MiB."
