domain: internal
breadcrumb: "Internal"

resources:
  _root:
    breadcrumb: "Internal"
    errors:
      unexpected:
        code: INTERNAL.UNEXPECTED
        status: 500
        message: "An unexpected internal error occurred"
        message_ja: "予期しない内部エラーが発生しました"
        message_zh: "发生意外的内部错误"
        description: "Final catch-all for unhandled panics or bugs. Should never be thrown explicitly from a handler; always paired with a request_id in the structured log for triage."
        userAction: "Retry; if the problem persists, contact your administrator with the request ID."

  db:
    breadcrumb: "Internal > Database"
    errors:
      unavailable:
        code: INTERNAL.DB.UNAVAILABLE
        status: 503
        message: "Database is temporarily unavailable"
        message_ja: "データベースに一時的にアクセスできません"
        message_zh: "数据库暂时不可用"
        description: "Returned when the API cannot reach the database (connection refused, timeout, failover in progress)."
        userAction: "Retry shortly; contact your administrator if the problem persists."

  storage:
    breadcrumb: "Internal > Storage"
    errors:
      not_configured:
        code: INTERNAL.STORAGE.NOT_CONFIGURED
        status: 503
        message: "Storage not configured"
        message_ja: "ストレージが未設定です"
        message_zh: "存储未配置"
        description: "File storage is not configured on this instance. Uploads and downloads of attachments are disabled."
        userAction: "Ask your instance administrator to configure object storage (S3-compatible endpoint, bucket, and credentials)."
