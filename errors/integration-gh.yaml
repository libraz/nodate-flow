domain: integration_gh
breadcrumb: "Integration > GitHub"

resources:
  webhook:
    breadcrumb: "Integration > GitHub > Webhook"
    errors:
      invalid_signature:
        code: INTEGRATION.GH.WEBHOOK_INVALID_SIGNATURE
        status: 401
        message: "GitHub webhook signature is invalid"
        message_ja: "GitHub Webhook の署名が無効です"
        message_zh: "GitHub Webhook 签名无效"
        description: "Returned when the X-Hub-Signature-256 header does not match the HMAC computed from the configured webhook secret."
        userAction: "Verify that the webhook secret in GitHub matches the one configured in the integration settings."

      payload_unparseable:
        code: INTEGRATION.GH.WEBHOOK_PAYLOAD_UNPARSEABLE
        status: 400
        message: "GitHub webhook payload could not be parsed"
        message_ja: "GitHub Webhook のペイロードを解析できませんでした"
        message_zh: "无法解析 GitHub Webhook 载荷"
        description: "Returned when the webhook body is not valid JSON or does not match the expected event schema."
        userAction: "Check the webhook delivery in GitHub for the failing payload."

      event_unsupported:
        code: INTEGRATION.GH.WEBHOOK_EVENT_UNSUPPORTED
        status: 400
        message: "GitHub webhook event type is not supported"
        message_ja: "GitHub Webhook のイベント種別は未対応です"
        message_zh: "不支持的 GitHub Webhook 事件类型"
        description: "Returned when the X-GitHub-Event header indicates an event that this integration does not handle."
        userAction: "Disable unsupported event types in the GitHub webhook configuration."
