domain: share
breadcrumb: "Share"

# Errors raised by the public-share surface (calendar_public_shares +
# calendar_public_share_events). The public render path is unauthenticated
# and uses the URL token as the sole capability; these codes cover the
# ways a token can be rejected, plus workspace-side management errors.

resources:
  share:
    breadcrumb: "Share"
    errors:
      not_found:
        code: SHARE.SHARE.NOT_FOUND
        status: 404
        message: "Share page not found"
        message_ja: "共有ページが見つかりません"
        description: "Returned when a share with the given public_id or token hash does not exist."
        userAction: "Verify the URL; if you rotated the token recently, use the new URL returned at rotate time."

      expired:
        code: SHARE.SHARE.EXPIRED
        status: 410
        message: "Share page has expired"
        message_ja: "共有ページの有効期限が切れました"
        description: "Returned when the share's expires_at is in the past. The row still exists but the public render refuses to serve it."
        userAction: "Ask a workspace member to extend or rotate the share, then use the new URL."

      token_invalid:
        code: SHARE.SHARE.TOKEN_INVALID
        status: 404
        message: "Share token is invalid"
        message_ja: "共有トークンが無効です"
        description: "Returned when the URL token does not match any token_hash. Deliberately 404 (not 401) so the existence of any share is not leaked by the status code."
        userAction: "Verify the URL was copied correctly. Rotation invalidates prior tokens."

      delete_forbidden:
        code: SHARE.SHARE.DELETE_FORBIDDEN
        status: 403
        message: "Only workspace admins or owners can delete a share"
        message_ja: "共有の削除はワークスペースの管理者またはオーナーのみ可能です"
        description: "Returned when a non-admin tries to delete a share. Create / edit / rotate / add events are open to all non-guest workspace members; delete is restricted to admin/owner to prevent accidental URL loss."
        userAction: "Ask a workspace admin or owner to delete the share on your behalf."

  share_event:
    breadcrumb: "Share > Event"
    errors:
      event_not_visible:
        code: SHARE.SHARE_EVENT.EVENT_NOT_VISIBLE
        status: 422
        message: "Event cannot be published"
        message_ja: "このイベントは公開できません"
        description: "Returned when attaching an event with visibility='confidential' to a share page. Confidential events are gated from the public surface."
        userAction: "Change the event's visibility to public or private before attaching, or pick a different event."

      reorder_invalid:
        code: SHARE.SHARE_EVENT.REORDER_INVALID
        status: 400
        message: "Reorder input must be a permutation of the share's current events"
        message_ja: "並び替えは現在の共有イベント全体を過不足なく指定してください"
        description: "Returned when a batch reorder request supplies a linkPublicIds array that is missing an existing link, references a link that does not belong to the share, or contains duplicates. The reorder is atomic and requires the full current set."
        userAction: "Refetch the share's event list and resubmit the reorder with every current link exactly once."
