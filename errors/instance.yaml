domain: instance
breadcrumb: "Instance"

resources:
  setup:
    breadcrumb: "Instance > Setup"
    errors:
      already_initialized:
        code: INSTANCE.SETUP.ALREADY_INITIALIZED
        status: 409
        message: "Instance has already been initialized"
        message_ja: "インスタンスは既に初期化済みです"
        description: "Returned when the initial setup endpoint is called after the instance has already been bootstrapped with an admin account."
        userAction: "Sign in with the existing admin account instead of running setup again."

  admin:
    breadcrumb: "Instance > Admin"
    errors:
      required:
        code: INSTANCE.ADMIN.REQUIRED
        status: 403
        message: "Instance administrator privileges are required"
        message_ja: "インスタンス管理者権限が必要です"
        description: "Returned when an endpoint that requires the instance-admin role is called by a non-admin user."
        userAction: "Ask an instance administrator to perform this operation."
      not_found:
        code: INSTANCE.ADMIN.NOT_FOUND
        status: 404
        message: "User is not an instance administrator"
        message_ja: "このユーザーはインスタンス管理者ではありません"
        description: "Returned when attempting to revoke admin privileges from a user who is not an instance admin."
        userAction: "Verify the user is listed as an instance administrator."
      self_revoke:
        code: INSTANCE.ADMIN.SELF_REVOKE
        status: 409
        message: "Cannot revoke your own administrator privileges"
        message_ja: "自身の管理者権限は取り消せません"
        description: "Returned when an instance admin tries to revoke their own admin grant."
        userAction: "Ask another instance administrator to revoke your privileges."
      last_admin:
        code: INSTANCE.ADMIN.LAST_ADMIN
        status: 409
        message: "Cannot revoke the last remaining administrator"
        message_ja: "最後の管理者は取り消せません"
        description: "Returned when revoking would leave the instance with zero admins."
        userAction: "Grant admin privileges to another user first."

  user:
    breadcrumb: "Instance > User"
    errors:
      not_found:
        code: INSTANCE.USER.NOT_FOUND
        status: 404
        message: "User not found"
        message_ja: "ユーザーが見つかりません"
        description: "Returned when an admin endpoint references a user that does not exist."
        userAction: "Verify the user ID."

  workspace:
    breadcrumb: "Instance > Workspace"
    errors:
      not_found:
        code: INSTANCE.WORKSPACE.NOT_FOUND
        status: 404
        message: "Workspace not found"
        message_ja: "ワークスペースが見つかりません"
        description: "Returned when an admin endpoint references a workspace that does not exist."
        userAction: "Verify the workspace ID."

  settings:
    breadcrumb: "Instance > Settings"
    errors:
      invalid_key:
        code: INSTANCE.SETTINGS.INVALID_KEY
        status: 400
        message: "Unknown setting key"
        message_ja: "未知の設定キーです"
        description: "Returned when a PATCH /admin/settings request references a setting key that is not recognized."
        userAction: "Use one of the supported setting keys."
      invalid_value:
        code: INSTANCE.SETTINGS.INVALID_VALUE
        status: 400
        message: "Invalid value for setting"
        message_ja: "設定値が不正です"
        description: "Returned when a setting value does not pass validation for its key."
        userAction: "Check the expected format for this setting."

  quota:
    breadcrumb: "Instance > Quota"
    errors:
      exceeded:
        code: INSTANCE.QUOTA.EXCEEDED
        status: 429
        message: "Instance quota has been exceeded"
        message_ja: "インスタンスの利用上限を超えました"
        description: "Returned when an instance-wide resource quota (workspaces, users, storage) is exhausted."
        userAction: "Contact your instance administrator to raise the quota."
