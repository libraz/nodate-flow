domain: integration_slack
breadcrumb: "Integration > Slack"

resources:
  webhook:
    breadcrumb: "Integration > Slack > Webhook"
    errors:
      signing_failed:
        code: INTEGRATION.SLACK.WEBHOOK_SIGNING_FAILED
        status: 401
        message: "Slack request signature verification failed"
        message_ja: "Slack リクエストの署名検証に失敗しました"
        description: "Returned when the X-Slack-Signature header does not match the HMAC computed from the configured signing secret, or the timestamp is outside the allowed window."
        userAction: "Verify that the signing secret in Slack matches the one configured in the integration settings."

      payload_unparseable:
        code: INTEGRATION.SLACK.WEBHOOK_PAYLOAD_UNPARSEABLE
        status: 400
        message: "Slack webhook payload could not be parsed"
        message_ja: "Slack Webhook のペイロードを解析できませんでした"
        description: "Returned when the Slack event payload is malformed or missing required fields."
        userAction: "Check the Slack app event subscription configuration."

  api:
    breadcrumb: "Integration > Slack > API"
    errors:
      token_invalid:
        code: INTEGRATION.SLACK.TOKEN_INVALID
        status: 401
        message: "Slack API token is invalid"
        message_ja: "Slack API トークンが無効です"
        description: "Returned when Slack rejects the integration's bot or user token."
        userAction: "Re-authorize the Slack integration."

      rate_limited:
        code: INTEGRATION.SLACK.RATE_LIMITED
        status: 429
        message: "Slack API rate limit exceeded"
        message_ja: "Slack API のレート制限を超えました"
        description: "Returned when Slack returns a 429 due to method-level rate limiting."
        userAction: "Wait for the Retry-After interval before retrying."
