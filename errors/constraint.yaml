domain: constraint
breadcrumb: "Constraint"

resources:
  parse:
    breadcrumb: "Constraint > Parse"
    errors:
      invalid_json:
        code: CONSTRAINT.PARSE.INVALID_JSON
        status: 422
        message: "Constraint expression is not valid JSON"
        message_ja: "制約式が有効な JSON ではありません"
        message_zh: "约束表达式不是有效的 JSON"
        description: "Returned when the stored constraint expression cannot be decoded as JSON before the DSL validator even runs."
        userAction: "Fix the JSON syntax in the constraint expression."

      unsupported_operator:
        code: CONSTRAINT.PARSE.UNSUPPORTED_OPERATOR
        status: 422
        message: "Constraint expression uses an operator that is not supported"
        message_ja: "制約式にサポートされていない演算子 {operator} が含まれています"
        message_zh: "约束表达式使用了不受支持的运算符 {operator}"
        description: "Returned when a constraint node references an op {operator} that is not in the closed DSL whitelist (ADR 0006). The offending operator is included in the error details."
        userAction: "Replace {operator} with one of the documented ops (and, or, not, time.*, dependency.*, actor.*, signal.*, approval.*, ci.*)."

      missing_arg:
        code: CONSTRAINT.PARSE.MISSING_ARG
        status: 422
        message: "Constraint expression is missing a required argument"
        message_ja: "制約式に必須の引数が欠落しています"
        message_zh: "约束表达式缺少必填参数"
        description: "Returned when a builtin is used without its required arg / taskIds / max field."
        userAction: "Provide the argument listed in the constraint DSL reference."

      empty_terms:
        code: CONSTRAINT.PARSE.EMPTY_TERMS
        status: 422
        message: "Constraint and/or requires at least one term"
        message_ja: "and / or には少なくとも 1 つの要素が必要です"
        message_zh: "and / or 至少需要一个子项"
        description: "Returned when an and / or node is supplied with an empty terms list."
        userAction: "Add at least one child expression to the and / or node."

  eval:
    breadcrumb: "Constraint > Eval"
    errors:
      date_parsing_failed:
        code: CONSTRAINT.EVAL.DATE_PARSING_FAILED
        status: 422
        message: "Constraint date argument could not be parsed as YYYY-MM-DD"
        message_ja: "制約の日付 {value} を YYYY-MM-DD 形式として解釈できませんでした"
        message_zh: "无法将约束日期参数 {value} 解析为 YYYY-MM-DD 格式"
        description: "Returned when a time.* builtin receives a non-parseable date literal {value} at evaluation time."
        userAction: "Send the date as a YYYY-MM-DD string (for example 2026-04-08)."
