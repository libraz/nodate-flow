domain: ai
breadcrumb: "AI"

resources:
  provider:
    breadcrumb: "AI > Provider"
    errors:
      not_configured:
        code: AI.PROVIDER.NOT_CONFIGURED
        status: 412
        message: "AI provider is not configured"
        description: "Returned when an AI feature is invoked but no provider credentials have been configured for the workspace or instance."
        userAction: "Configure an AI provider in workspace or instance settings."

      upstream_call_failed:
        code: AI.PROVIDER.UPSTREAM_CALL_FAILED
        status: 502
        message: "AI provider call failed"
        description: "Returned when the upstream LLM provider returned a non-success response or could not be reached."
        userAction: "Retry in a moment; if the problem persists, check the provider's status page."

      upstream_timeout:
        code: AI.PROVIDER.UPSTREAM_TIMEOUT
        status: 504
        message: "AI provider call timed out"
        description: "Returned when the upstream LLM provider did not respond within the configured timeout."
        userAction: "Retry the request, or reduce the prompt size."

  cost:
    breadcrumb: "AI > Cost"
    errors:
      guard_exceeded:
        code: AI.COST.GUARD_EXCEEDED
        status: 402
        message: "AI cost guard threshold exceeded"
        description: "Returned when the workspace's monthly AI spend has reached the configured cost guard limit."
        userAction: "Wait for the next billing period or raise the cost guard in workspace settings."

  response:
    breadcrumb: "AI > Response"
    errors:
      parse_failed:
        code: AI.RESPONSE.PARSE_FAILED
        status: 502
        message: "AI provider response could not be parsed"
        description: "Returned when the upstream LLM returned a completion whose body could not be decoded into the expected JSON shape."
        userAction: "Retry the request; if the problem persists, check the provider or model configuration."

  nl_query:
    breadcrumb: "AI > NL Query"
    errors:
      unparseable:
        code: AI.NL_QUERY.UNPARSEABLE
        status: 422
        message: "Could not turn that into a filter"
        description: "Returned when the NL query compiler could not produce a valid Lens JSON from the user's prose, either because the upstream LLM emitted malformed output or because the result failed schema validation against the closed Lens grammar (ADR 0004)."
        userAction: "Rephrase the request — e.g. \"blocked tasks due this week\"."

  redaction:
    breadcrumb: "AI > Redaction"
    errors:
      pipeline_failed:
        code: AI.REDACTION.PIPELINE_FAILED
        status: 500
        message: "Sensitive data redaction failed"
        description: "Returned when the pre-LLM redaction pipeline raised an error and the request was blocked to prevent leaking secrets."
        userAction: "Retry; if the problem persists, contact your administrator."

  agent:
    breadcrumb: "AI > Agent"
    errors:
      not_found:
        code: AI.AGENT.NOT_FOUND
        status: 404
        message: "AI agent not found"
        description: "Returned when an operation targets an ai_agents row that does not exist in the workspace or has been disabled."
        userAction: "Verify the agent id and that it belongs to this workspace."

      paused:
        code: AI.AGENT.PAUSED
        status: 409
        message: "AI agent is paused"
        description: "Returned when a manual trigger targets an agent whose paused=TRUE kill switch is engaged."
        userAction: "Resume the agent from the agents settings page before triggering it."

      runtime_disabled:
        code: AI.AGENT.RUNTIME_DISABLED
        status: 503
        message: "AI agent runtime is not configured"
        description: "Returned when a trigger endpoint is reached but neither the scheduler queue nor a synchronous runner is wired on this replica."
        userAction: "NF_AGENT_RUNNER defaults to 'orchestrator'. Set it to 'log' only for debugging. Ensure a provider is configured."

  model:
    breadcrumb: "AI > Model"
    errors:
      not_found:
        code: AI.MODEL.NOT_FOUND
        status: 404
        message: "AI model not found"
        description: "Returned when an operation references an ai_models row that does not exist in the workspace or has been disabled."
        userAction: "Pick a model from the workspace's registered providers."

  safety:
    breadcrumb: "AI > Safety"
    errors:
      blocked:
        code: AI.SAFETY.BLOCKED
        status: 422
        message: "Request blocked by safety policy"
        description: "Returned when the prompt or response was blocked by the configured safety filters."
        userAction: "Rephrase the request to comply with the safety policy."
