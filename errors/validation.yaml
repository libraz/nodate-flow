domain: validation
breadcrumb: "Validation"

resources:
  body:
    breadcrumb: "Validation > Body"
    errors:
      field_missing:
        code: VALIDATION.BODY.FIELD_MISSING
        status: 422
        message: "A required field is missing in the request body"
        message_ja: "リクエストボディに必須フィールドがありません"
        message_zh: "请求体缺少必填字段"
        description: "Returned when one or more required fields are absent from the request body. The missing field paths are listed in details."
        userAction: "Add the missing fields listed in the error details and retry."

      field_invalid:
        code: VALIDATION.BODY.FIELD_INVALID
        status: 422
        message: "A field in the request body is invalid"
        message_ja: "リクエストボディのフィールドが不正です"
        message_zh: "请求体中的字段无效"
        description: "Returned when one or more fields fail schema validation (type, format, range). Failing field paths are listed in details."
        userAction: "Correct the fields listed in the error details and retry."

      date_format_invalid:
        code: VALIDATION.BODY.DATE_FORMAT_INVALID
        status: 400
        message: "Date must be in YYYY-MM-DD format"
        message_ja: "日付は YYYY-MM-DD 形式で指定してください"
        message_zh: "日期必须使用 YYYY-MM-DD 格式"
        description: "Returned when a date field fails to parse as an ISO 8601 calendar date (YYYY-MM-DD)."
        userAction: "Send the date as a YYYY-MM-DD string (for example 2026-04-08)."

      due_before_start:
        code: VALIDATION.BODY.DUE_BEFORE_START
        status: 400
        message: "Due date must be on or after start date."
        message_ja: "期限日は開始日以降にしてください。"
        message_zh: "截止日期必须不早于开始日期。"
        description: "Returned when a task update would leave dueOn strictly earlier than startedOn, either because the incoming dueOn precedes an existing startedOn or both fields are supplied in the body and inverted."
        userAction: "Choose a due date on or after the start date, or update the start date to be on or before the due date."

      unparseable:
        code: VALIDATION.BODY.UNPARSEABLE
        status: 400
        message: "Request body could not be parsed"
        message_ja: "リクエストボディを解析できませんでした"
        message_zh: "无法解析请求体"
        description: "Returned when the request body is not valid JSON or does not match the declared content-type."
        userAction: "Send a syntactically valid JSON body matching the API schema."

  query:
    breadcrumb: "Validation > Query"
    errors:
      field_invalid:
        code: VALIDATION.QUERY.FIELD_INVALID
        status: 422
        message: "A query parameter is invalid"
        message_ja: "クエリパラメータが不正です"
        message_zh: "查询参数无效"
        description: "Returned when a query parameter fails schema validation (type, range, enum)."
        userAction: "Correct the query parameter listed in details and retry."

      unknown_field:
        code: VALIDATION.QUERY.UNKNOWN_FIELD
        status: 422
        message: "Unknown query parameter"
        message_ja: "未知のクエリパラメータです"
        message_zh: "未知的查询参数"
        description: "Returned when an unknown query parameter is supplied and strict mode is enabled."
        userAction: "Remove the unknown query parameter."

  file:
    breadcrumb: "Validation > File"
    errors:
      type_not_allowed:
        code: VALIDATION.FILE.TYPE_NOT_ALLOWED
        status: 415
        message: "File type is not allowed"
        message_ja: "許可されていないファイル形式です"
        message_zh: "不允许的文件类型"
        description: "Returned when the uploaded file's MIME type is not in the allowlist."
        userAction: "Upload a file with an allowed type (images, documents, archives, text)."

      too_large:
        code: VALIDATION.FILE.TOO_LARGE
        status: 413
        message: "File exceeds the maximum allowed size"
        message_ja: "ファイルサイズが上限を超えています"
        message_zh: "文件大小超过上限"
        description: "Returned when the uploaded file exceeds the per-file size limit."
        userAction: "Reduce the file size and try again."

  path:
    breadcrumb: "Validation > Path"
    errors:
      param_invalid:
        code: VALIDATION.PATH.PARAM_INVALID
        status: 400
        message: "A path parameter is invalid"
        message_ja: "パスパラメータが不正です"
        message_zh: "路径参数无效"
        description: "Returned when a URL path parameter does not match its expected format (UUID, slug, integer)."
        userAction: "Check the URL and correct the malformed parameter."
