# Reserved: handlers not yet implemented
domain: webhook
breadcrumb: "Webhook"

resources:
  subscription:
    breadcrumb: "Webhook > Subscription"
    errors:
      not_found:
        code: WEBHOOK.SUBSCRIPTION.NOT_FOUND
        status: 404
        message: "Webhook subscription not found"
        description: "Returned when a webhook subscription with the given public_id does not exist or the actor does not have access to it."
        userAction: "Verify the subscription ID, or refresh the list to see current webhook subscriptions."

      url_unreachable:
        code: WEBHOOK.SUBSCRIPTION.URL_UNREACHABLE
        status: 400
        message: "Webhook URL is not reachable"
        description: "Returned when a test delivery to the configured webhook URL fails because the endpoint cannot be reached or does not respond with a success status."
        userAction: "Check the webhook URL is correct, publicly accessible, and returns a 2xx status."

      limit_exceeded:
        code: WEBHOOK.SUBSCRIPTION.LIMIT_EXCEEDED
        status: 409
        message: "Maximum webhook subscriptions per workspace reached"
        description: "Returned when the workspace has already reached the maximum number of allowed webhook subscriptions."
        userAction: "Remove unused webhook subscriptions before adding a new one."

  delivery:
    breadcrumb: "Webhook > Delivery"
    errors:
      not_found:
        code: WEBHOOK.DELIVERY.NOT_FOUND
        status: 404
        message: "Webhook delivery not found"
        description: "Returned when a webhook delivery with the given public_id does not exist or the actor does not have access to it."
        userAction: "Verify the delivery ID, or refresh the list to see recent deliveries."

      already_delivered:
        code: WEBHOOK.DELIVERY.ALREADY_DELIVERED
        status: 409
        message: "Webhook delivery has already been completed"
        description: "Returned when attempting to re-deliver a webhook delivery that has already been successfully completed."
        userAction: "No action needed; the delivery has already been sent. Create a new delivery if needed."
