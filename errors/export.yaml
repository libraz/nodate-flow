domain: export
breadcrumb: "Export"

resources:
  task:
    breadcrumb: "Export > Task"
    errors:
      lens_not_found:
        code: EXPORT.TASK.LENS_NOT_FOUND
        status: 404
        message: "Lens referenced for export not found"
        message_ja: "エクスポート対象のビューが見つかりません"
        message_zh: "未找到导出所引用的视图"
        description: "Returned when the saved view (lens) specified as the source for the export does not exist or has been deleted."
        userAction: "Verify the lens ID, or choose a different saved view."

      dataset_query_failed:
        code: EXPORT.TASK.DATASET_QUERY_FAILED
        status: 500
        message: "Could not load tasks for export"
        message_ja: "エクスポート対象のタスクを取得できませんでした"
        message_zh: "无法加载用于导出的任务"
        description: "Returned when the database query that materialises the rows for the export (workspace-scoped or lens-scoped) fails before any output is rendered."
        userAction: "Retry the export; if the problem persists, contact your administrator."
