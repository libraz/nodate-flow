# Reserved: handlers not yet implemented
domain: export
breadcrumb: "Export"

resources:
  task:
    breadcrumb: "Export > Task"
    errors:
      format_unsupported:
        code: EXPORT.TASK.FORMAT_UNSUPPORTED
        status: 400
        message: "Unsupported export format"
        message_ja: "対応していないエクスポート形式です"
        description: "Returned when the requested export format is not one of the supported types (csv, json)."
        userAction: "Use csv or json as the export format."

      lens_not_found:
        code: EXPORT.TASK.LENS_NOT_FOUND
        status: 404
        message: "Lens referenced for export not found"
        message_ja: "エクスポート対象のビューが見つかりません"
        description: "Returned when the saved view (lens) specified as the source for the export does not exist or has been deleted."
        userAction: "Verify the lens ID, or choose a different saved view."

      too_many_rows:
        code: EXPORT.TASK.TOO_MANY_ROWS
        status: 422
        message: "Export exceeds maximum row limit"
        message_ja: "エクスポート件数が上限を超えています"
        description: "Returned when the result set for the export exceeds the configured maximum number of rows."
        userAction: "Apply filters or narrow the lens to reduce the number of rows."

      dataset_query_failed:
        code: EXPORT.TASK.DATASET_QUERY_FAILED
        status: 500
        message: "Could not load tasks for export"
        message_ja: "エクスポート対象のタスクを取得できませんでした"
        message_zh: "无法加载用于导出的任务"
        description: "Returned when the database query that materialises the rows for the export (workspace-scoped or lens-scoped) fails before any output is rendered."
        userAction: "Retry the export; if the problem persists, contact your administrator."

      format_render_failed:
        code: EXPORT.TASK.FORMAT_RENDER_FAILED
        status: 500
        message: "Could not render export file"
        message_ja: "エクスポートファイルの生成に失敗しました"
        message_zh: "无法生成导出文件"
        description: "Returned when serialising the materialised dataset into the requested format (csv, json) failed, e.g. an encoding error mid-stream."
        userAction: "Retry the export; if the problem persists, choose a different format or contact your administrator."

      storage_write_failed:
        code: EXPORT.TASK.STORAGE_WRITE_FAILED
        status: 500
        message: "Could not write export file"
        message_ja: "エクスポートファイルの書き込みに失敗しました"
        message_zh: "无法写入导出文件"
        description: "Returned when the export file could not be written to its destination (response stream closed early, temporary storage full, or storage backend unavailable)."
        userAction: "Retry the export; if the problem persists, contact your administrator."
