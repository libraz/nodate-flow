domain: ws
breadcrumb: "Workspace"

resources:
  workspace:
    breadcrumb: "Workspace"
    errors:
      not_found:
        code: WS.WORKSPACE.NOT_FOUND
        status: 404
        message: "Workspace not found"
        description: "Returned when a workspace with the given public_id does not exist or the actor has no visibility into it."
        userAction: "Verify the workspace ID, or ask an admin to add you as a member."

      access_denied:
        code: WS.WORKSPACE.ACCESS_DENIED
        status: 403
        message: "You do not have access to this workspace"
        description: "Returned when the actor is authenticated but is not a member of the target workspace."
        userAction: "Ask a workspace admin to invite you."

      slug_already_taken:
        code: WS.WORKSPACE.SLUG_ALREADY_TAKEN
        status: 409
        message: "Workspace slug is already taken"
        description: "Returned when the requested workspace slug conflicts with an existing workspace on the same instance."
        userAction: "Choose a different slug."

  project:
    breadcrumb: "Workspace > Project"
    errors:
      not_found:
        code: WS.PROJECT.NOT_FOUND
        status: 404
        message: "Project not found"
        description: "Returned when a project does not exist or when the actor cannot access it (404 to avoid leaking existence)."
        userAction: "Verify the project ID, or contact a workspace admin if you should have access."

      access_denied:
        code: WS.PROJECT.ACCESS_DENIED
        status: 403
        message: "You do not have access to this project"
        description: "Returned when the actor is a workspace member but lacks the required project role."
        userAction: "Ask a project lead to grant you access."

      slug_already_taken:
        code: WS.PROJECT.SLUG_ALREADY_TAKEN
        status: 409
        message: "Project slug is already taken"
        description: "Returned when the requested project slug already exists within the workspace."
        userAction: "Choose a different slug."

      identifier_already_taken:
        code: WS.PROJECT.IDENTIFIER_ALREADY_TAKEN
        status: 409
        message: "Project identifier is already taken"
        description: "Returned when the requested project identifier already exists within the workspace."
        userAction: "Choose a different identifier."

      feature_disabled:
        code: WS.PROJECT.FEATURE_DISABLED
        status: 403
        message: "This feature is disabled for the project"
        description: "Returned when a request targets a feature that has been disabled in the project settings."
        userAction: "Enable the feature in project settings, or contact a project admin."

  task:
    breadcrumb: "Workspace > Task"
    errors:
      not_found:
        code: WS.TASK.NOT_FOUND
        status: 404
        message: "Task not found"
        description: "Returned when a task with the given public_id does not exist or has been deleted in the current workspace."
        userAction: "Verify the task ID, or refresh the list to see current tasks."

      access_denied:
        code: WS.TASK.ACCESS_DENIED
        status: 403
        message: "You do not have access to this task"
        description: "Returned when the actor lacks the required project role to read or modify the task."
        userAction: "Ask a project lead to grant you access."

      update_conflict:
        code: WS.TASK.UPDATE_CONFLICT
        status: 409
        message: "Task was modified by someone else"
        description: "Returned when an optimistic concurrency check (version or updated_at) fails during update."
        userAction: "Reload the task to see the latest version, then re-apply your changes."

      title_too_long:
        code: WS.TASK.TITLE_TOO_LONG
        status: 422
        message: "Task title is too long"
        description: "Returned when the submitted title exceeds the maximum allowed length."
        userAction: "Shorten the title and retry."

      state_transition_blocked_by_constraint:
        code: WS.TASK.STATE_TRANSITION_BLOCKED_BY_CONSTRAINT
        status: 422
        message: "Task cannot transition to the requested state"
        description: "Returned when an unsatisfied constraint blocks the requested lifecycle transition."
        userAction: "Review unmet constraints in the task detail panel and resolve them before retrying."

      transition_unknown:
        code: WS.TASK.TRANSITION_UNKNOWN
        status: 400
        message: "Unknown task transition"
        description: "Returned when the client submits a transition name that is not one of {start|block|unblock|submit|complete|reopen|cancel}. Rejected at the HTTP layer before the constraint engine runs."
        userAction: "Use one of the supported transition names defined by the API."

      transition_rejected:
        code: WS.TASK.TRANSITION_REJECTED
        status: 422
        message: "Task transition not allowed in current state"
        description: "Returned by the constraint engine when the requested transition is illegal for the task's current lifecycle state."
        userAction: "Refresh the task to see its current state and choose a valid transition."

      already_archived:
        code: WS.TASK.ALREADY_ARCHIVED
        status: 409
        message: "Task is already archived"
        description: "Returned when attempting to archive a task that is already in the archived state."
        userAction: "The task is already archived."

      not_archived:
        code: WS.TASK.NOT_ARCHIVED
        status: 409
        message: "Task is not archived"
        description: "Returned when attempting to unarchive a task that is not in the archived state."
        userAction: "The task is not archived."

  member:
    breadcrumb: "Workspace > Member"
    errors:
      role_denied:
        code: WS.MEMBER.ROLE_DENIED
        status: 403
        message: "Your role does not permit this action"
        description: "Returned when the actor's workspace role is insufficient for the attempted operation."
        userAction: "Ask a workspace admin to elevate your role."

      not_found:
        code: WS.MEMBER.NOT_FOUND
        status: 404
        message: "Workspace member not found"
        description: "Returned when the target user is not a member of the workspace."
        userAction: "Invite the user to the workspace first."

  notification:
    breadcrumb: "Workspace > Notification"
    errors:
      not_found:
        code: WS.NOTIFICATION.NOT_FOUND
        status: 404
        message: "Notification not found"
        description: "Returned when a notification with the given public_id does not exist or belongs to another user."
        userAction: "Verify the notification ID."

  lens:
    breadcrumb: "Workspace > Lens"
    errors:
      not_found:
        code: WS.LENS.NOT_FOUND
        status: 404
        message: "Saved view not found"
        description: "Returned when a lens with the given public_id does not exist or has been deleted."
        userAction: "Verify the view ID, or refresh the list to see current saved views."

      name_already_taken:
        code: WS.LENS.NAME_ALREADY_TAKEN
        status: 409
        message: "A saved view with this name already exists"
        description: "Returned when the requested lens name already exists within the same workspace/project scope."
        userAction: "Choose a different name."

      already_public:
        code: WS.LENS.ALREADY_PUBLIC
        status: 409
        message: "This saved view is already published"
        description: "Returned when attempting to publish a lens that is already shared publicly."
        userAction: "The view is already public. Use the existing share link."

      already_private:
        code: WS.LENS.ALREADY_PRIVATE
        status: 409
        message: "This saved view is already private"
        description: "Returned when attempting to unpublish a lens that is not currently shared."
        userAction: "The view is already private."

      public_token_invalid:
        code: WS.LENS.PUBLIC_TOKEN_INVALID
        status: 404
        message: "Public share link not found or expired"
        description: "Returned when a public lens token does not match any published lens."
        userAction: "Verify the share link is correct and the view is still published."

  label:
    breadcrumb: "Workspace > Label"
    errors:
      not_found:
        code: WS.LABEL.NOT_FOUND
        status: 404
        message: "Label not found"
        description: "Returned when a label with the given public_id does not exist or has been deleted."
        userAction: "Verify the label ID, or refresh the list to see current labels."

      name_already_taken:
        code: WS.LABEL.NAME_ALREADY_TAKEN
        status: 409
        message: "A label with this name already exists"
        description: "Returned when the requested label name already exists within the same workspace/project scope."
        userAction: "Choose a different name."

  favorite:
    breadcrumb: "Workspace > Favorite"
    errors:
      not_found:
        code: WS.FAVORITE.NOT_FOUND
        status: 404
        message: "Favorite not found"
        description: "Returned when a favorite with the given public_id does not exist or belongs to another user."
        userAction: "Verify the favorite ID."

      already_exists:
        code: WS.FAVORITE.ALREADY_EXISTS
        status: 409
        message: "This item is already in your favorites"
        description: "Returned when the actor attempts to add an item that is already in their favorites list."
        userAction: "The item is already favorited."

  reaction:
    breadcrumb: "Workspace > Reaction"
    errors:
      not_found:
        code: WS.REACTION.NOT_FOUND
        status: 404
        message: "Reaction not found"
        description: "Returned when a reaction with the given public_id does not exist or has been removed."
        userAction: "Verify the reaction ID."

      already_exists:
        code: WS.REACTION.ALREADY_EXISTS
        status: 409
        message: "You already reacted with this emoji"
        description: "Returned when the actor attempts to add a duplicate reaction with the same emoji to the same target."
        userAction: "Remove the existing reaction first if you want to change it."

  mention:
    breadcrumb: "Workspace > Mention"
    errors:
      not_found:
        code: WS.MENTION.NOT_FOUND
        status: 404
        message: "Mention not found"
        description: "Returned when a mention with the given public_id does not exist or has been removed."
        userAction: "Verify the mention ID."

  view_preference:
    breadcrumb: "Workspace > View Preference"
    errors:
      not_found:
        code: WS.VIEW_PREFERENCE.NOT_FOUND
        status: 404
        message: "View preference not found"
        description: "Returned when a view preference with the given public_id does not exist for the current user."
        userAction: "Verify the view preference ID, or create a new one."

  notification_preference:
    breadcrumb: "Workspace > Notification Preference"
    errors:
      not_found:
        code: WS.NOTIFICATION_PREFERENCE.NOT_FOUND
        status: 404
        message: "Notification preference not found"
        description: "Returned when a notification preference with the given public_id does not exist for the current user."
        userAction: "Verify the notification preference ID, or create a new one."

  intake:
    breadcrumb: "Workspace > Intake"
    errors:
      not_found:
        code: WS.INTAKE.NOT_FOUND
        status: 404
        message: "Intake item not found"
        description: "Returned when an intake item with the given public_id does not exist or has been removed."
        userAction: "Verify the intake item ID, or refresh the list to see current items."

      already_triaged:
        code: WS.INTAKE.ALREADY_TRIAGED
        status: 409
        message: "This intake item has already been triaged"
        description: "Returned when attempting to triage an intake item that has already been triaged."
        userAction: "The item has already been triaged. No further action is needed."

      already_converted:
        code: WS.INTAKE.ALREADY_CONVERTED
        status: 409
        message: "This intake item has already been converted to a task"
        description: "Returned when attempting to convert an intake item that has already been converted to a task."
        userAction: "The item has already been converted. Open the linked task instead."

  description_version:
    breadcrumb: "Workspace > Description Version"
    errors:
      not_found:
        code: WS.DESCRIPTION_VERSION.NOT_FOUND
        status: 404
        message: "Description version not found"
        description: "Returned when a description version with the given public_id does not exist or has been removed."
        userAction: "Verify the version ID, or refresh the version history."

  import:
    breadcrumb: "Workspace > Import"
    errors:
      not_found:
        code: WS.IMPORT.NOT_FOUND
        status: 404
        message: "Import job not found"
        description: "Returned when an import job with the given public_id does not exist or belongs to a different workspace."
        userAction: "Verify the import job ID, or refresh the list to see current imports."

      already_running:
        code: WS.IMPORT.ALREADY_RUNNING
        status: 409
        message: "An import job is already running for this project"
        description: "Returned when a new import is requested while another import job is still in progress for the same project."
        userAction: "Wait for the current import to finish, or cancel it before starting a new one."

      cannot_cancel:
        code: WS.IMPORT.CANNOT_CANCEL
        status: 409
        message: "Only pending or running import jobs can be cancelled"
        description: "Returned when attempting to cancel an import job that has already completed, failed, or been cancelled."
        userAction: "The import job is no longer in a cancellable state."
