domain: auth
breadcrumb: "Auth"

resources:
  register:
    breadcrumb: "Auth > Register"
    errors:
      email_already_taken:
        code: AUTH.REGISTER.EMAIL_ALREADY_TAKEN
        status: 409
        message: "Email address is already registered"
        message_ja: "このメールアドレスは既に登録されています"
        message_zh: "该邮箱地址已被注册"
        description: "Returned when a registration attempt uses an email that is already associated with an existing account."
        userAction: "Sign in with the existing account, or use a different email address."

      password_too_weak:
        code: AUTH.REGISTER.PASSWORD_TOO_WEAK
        status: 422
        message: "Password does not meet strength requirements"
        message_ja: "パスワードの強度が不足しています"
        message_zh: "密码强度不符合要求"
        description: "Returned when the submitted password fails the minimum complexity policy (length, character classes)."
        userAction: "Choose a stronger password with at least 12 characters including mixed case, numbers, and symbols."

      instance_registration_disabled:
        code: AUTH.REGISTER.INSTANCE_REGISTRATION_DISABLED
        status: 403
        message: "Self-service registration is disabled on this instance"
        message_ja: "このインスタンスではセルフサービス登録が無効化されています"
        message_zh: "本实例已禁用自助注册"
        description: "Returned when an open registration attempt is made on an instance where self-service signup has been disabled by an admin."
        userAction: "Contact your instance administrator to request an account."

  login:
    breadcrumb: "Auth > Login"
    errors:
      invalid_credentials:
        code: AUTH.LOGIN.INVALID_CREDENTIALS
        status: 401
        message: "Invalid email or password"
        message_ja: "メールアドレスまたはパスワードが違います"
        message_zh: "邮箱或密码不正确"
        description: "Returned when the submitted email does not exist or the password does not match. The same code is returned in both cases to prevent user enumeration."
        userAction: "Check your credentials and try again, or reset your password."

      account_locked:
        code: AUTH.LOGIN.ACCOUNT_LOCKED
        status: 423
        message: "Account is temporarily locked"
        message_ja: "アカウントが一時的にロックされています"
        message_zh: "账户已被临时锁定"
        description: "Returned when the account has been locked after repeated failed login attempts."
        userAction: "Wait for the lock period to elapse or contact an administrator."

      rate_limited_after_retries:
        code: AUTH.LOGIN.RATE_LIMITED_AFTER_RETRIES
        status: 429
        message: "Too many failed login attempts"
        message_ja: "ログイン試行回数が多すぎます"
        message_zh: "登录失败次数过多"
        description: "Returned when the login rate limit for the source IP or account has been exceeded."
        userAction: "Wait a few minutes before trying again."

  password:
    breadcrumb: "Auth > Password"
    errors:
      current_mismatch:
        code: AUTH.PASSWORD.CURRENT_MISMATCH
        status: 401
        message: "Current password is incorrect"
        message_ja: "現在のパスワードが正しくありません"
        message_zh: "当前密码不正确"
        description: "Returned by /me/password when the submitted current password does not verify against the stored hash."
        userAction: "Re-enter your current password."

      too_weak:
        code: AUTH.PASSWORD.TOO_WEAK
        status: 422
        message: "Password does not meet strength requirements"
        message_ja: "パスワードの強度が不足しています"
        message_zh: "密码强度不符合要求"
        description: "Returned by /me/password when the new password is shorter than the minimum length."
        userAction: "Choose a longer password."

      no_local_identity:
        code: AUTH.PASSWORD.NO_LOCAL_IDENTITY
        status: 409
        message: "Account has no local password to change"
        message_ja: "このアカウントには変更可能なパスワードがありません"
        message_zh: "此账户没有可修改的本地密码"
        description: "Returned when /me/password is called for an account that only has OIDC identities."
        userAction: "Change your password through your identity provider instead."

  totp:
    breadcrumb: "Auth > TOTP"
    errors:
      code_required:
        code: AUTH.TOTP.CODE_REQUIRED
        status: 401
        message: "Two-factor authentication code is required"
        message_ja: "二段階認証コードが必要です"
        message_zh: "需要输入两步验证代码"
        description: "Returned when the account has 2FA enabled and the login request did not include a TOTP code."
        userAction: "Submit the 6-digit code from your authenticator app."

      code_mismatch:
        code: AUTH.TOTP.CODE_MISMATCH
        status: 401
        message: "Two-factor authentication code is incorrect"
        message_ja: "二段階認証コードが正しくありません"
        message_zh: "两步验证代码不正确"
        description: "Returned when the submitted TOTP code does not match the expected value within the allowed time window."
        userAction: "Re-enter the current code from your authenticator app."

      already_enrolled:
        code: AUTH.TOTP.ALREADY_ENROLLED
        status: 409
        message: "Two-factor authentication is already enabled"
        message_ja: "二段階認証は既に有効になっています"
        message_zh: "两步验证已启用"
        description: "Returned when attempting to enroll TOTP for an account that already has it active."
        userAction: "Disable the existing 2FA before enrolling again."

      not_enrolled:
        code: AUTH.TOTP.NOT_ENROLLED
        status: 409
        message: "Two-factor authentication is not enabled"
        message_ja: "二段階認証は有効になっていません"
        message_zh: "两步验证未启用"
        description: "Returned when confirming or disabling TOTP on an account that has no pending or active enrollment."
        userAction: "Start a new TOTP enrollment first."

      recovery_code_invalid:
        code: AUTH.TOTP.RECOVERY_CODE_INVALID
        status: 401
        message: "Recovery code is invalid"
        message_ja: "リカバリコードが正しくありません"
        message_zh: "恢复代码无效"
        description: "Returned when the submitted recovery code does not match any unused code on file for the account."
        userAction: "Try a different recovery code, or sign in with your authenticator app code."

      recovery_code_required:
        code: AUTH.TOTP.RECOVERY_CODE_REQUIRED
        status: 400
        message: "Either a TOTP code or a recovery code is required"
        message_ja: "認証コードまたはリカバリコードを入力してください"
        message_zh: "需要提供两步验证代码或恢复代码"
        description: "Returned when the TOTP login step is called with neither a 6-digit code nor a recovery code."
        userAction: "Provide your authenticator code or one of your saved recovery codes."

      not_configured:
        code: AUTH.TOTP.NOT_CONFIGURED
        status: 503
        message: "Two-factor authentication is not available on this server"
        message_ja: "このサーバーでは二段階認証が利用できません"
        message_zh: "本服务器未启用两步验证"
        description: "Returned when the server has no encryption key configured (NF_SECRET_KEY is unset) so TOTP secrets cannot be stored."
        userAction: "Ask the instance administrator to configure NF_SECRET_KEY."

  session:
    breadcrumb: "Auth > Session"
    errors:
      expired:
        code: AUTH.SESSION.EXPIRED
        status: 401
        message: "Session has expired"
        message_ja: "セッションの有効期限が切れました"
        message_zh: "会话已过期"
        description: "Returned when the session or access token is past its expiration timestamp."
        userAction: "Sign in again to continue."

      revoked:
        code: AUTH.SESSION.REVOKED
        status: 401
        message: "Session has been revoked"
        message_ja: "セッションは無効化されました"
        message_zh: "会话已被撤销"
        description: "Returned when the session has been explicitly invalidated (logout elsewhere, admin revoke, password change)."
        userAction: "Sign in again."

      unauthorized:
        code: AUTH.SESSION.UNAUTHORIZED
        status: 401
        message: "You must be signed in to access this resource"
        message_ja: "このリソースにアクセスするにはサインインが必要です"
        message_zh: "访问此资源需要先登录"
        description: "Returned when a request reaches a protected route with no authenticated session present on the context. Distinct from AUTH.SESSION.EXPIRED (had a valid session, now expired) and AUTH.SESSION.REVOKED (session was explicitly invalidated server-side)."
        userAction: "Sign in and retry the request."
        i18nKey: "auth.errors.session_unauthorized"

  permission:
    breadcrumb: "Auth > Permission"
    errors:
      instance_admin_required:
        code: AUTH.PERMISSION.INSTANCE_ADMIN_REQUIRED
        status: 403
        message: "Instance administrator privileges are required"
        message_ja: "インスタンス管理者権限が必要です"
        message_zh: "此操作需要实例管理员权限"
        description: "Returned when an endpoint that requires the instance-admin role is called by a non-admin user."
        userAction: "Ask an instance administrator to perform this operation."
        i18nKey: "auth.errors.permission_instance_admin_required"

  token:
    breadcrumb: "Auth > Token"
    errors:
      refresh_invalid:
        code: AUTH.TOKEN.REFRESH_INVALID
        status: 401
        message: "Refresh token is invalid"
        message_ja: "リフレッシュトークンが無効です"
        message_zh: "刷新令牌无效"
        description: "Returned when a refresh token is malformed, unknown, or has already been rotated."
        userAction: "Sign in again to obtain a new session."

      refresh_expired:
        code: AUTH.TOKEN.REFRESH_EXPIRED
        status: 401
        message: "Refresh token has expired"
        message_ja: "リフレッシュトークンの有効期限が切れました"
        message_zh: "刷新令牌已过期"
        description: "Returned when the refresh token is past its lifetime and can no longer be exchanged."
        userAction: "Sign in again."

      missing_or_malformed:
        code: AUTH.TOKEN.MISSING_OR_MALFORMED
        status: 401
        message: "Missing or invalid authentication token"
        message_ja: "認証トークンが欠落しているか不正です"
        message_zh: "认证令牌缺失或格式错误"
        description: "Returned when the Authorization header is absent, does not start with Bearer, or the token is empty. Distinct from signature verification failures."
        userAction: "Include a valid Bearer token in the Authorization header."

      signature_invalid:
        code: AUTH.TOKEN.SIGNATURE_INVALID
        status: 401
        message: "Token signature is invalid"
        message_ja: "トークンの署名が無効です"
        message_zh: "令牌签名无效"
        description: "Returned when the JWT signature verification fails (wrong key, tampered payload)."
        userAction: "Sign in again."

  magic_link:
    breadcrumb: "Auth > Magic Link"
    errors:
      malformed:
        code: AUTH.MAGIC_LINK.MALFORMED
        status: 401
        message: "Magic link token is malformed or unknown"
        message_ja: "マジックリンクのトークンが不正または未知です"
        message_zh: "魔法链接令牌格式错误或未知"
        description: "Returned when the magic link token is missing, has an invalid format, or does not match any issued token (signature / hash mismatch). Distinct from EXPIRED so the UI can hint that the link was tampered with or copied incorrectly."
        userAction: "Request a new magic link from the login page and click it directly without modifying the URL."

      expired:
        code: AUTH.MAGIC_LINK.EXPIRED
        status: 401
        message: "Magic link has expired"
        message_ja: "マジックリンクの有効期限が切れています"
        message_zh: "魔法链接已过期"
        description: "Returned when the magic link token is past its 15-minute expiration timestamp."
        userAction: "Request a new magic link from the login page; links remain valid for 15 minutes."

      revoked:
        code: AUTH.MAGIC_LINK.REVOKED
        status: 401
        message: "Magic link has been revoked"
        message_ja: "マジックリンクは無効化されました"
        message_zh: "魔法链接已被撤销"
        description: "Returned when the magic link token has been explicitly invalidated before use (for example when a newer link supersedes it or an admin revoked the account)."
        userAction: "Request a new magic link from the login page."

      already_used:
        code: AUTH.MAGIC_LINK.ALREADY_USED
        status: 409
        message: "This magic link has already been used"
        message_ja: "このマジックリンクは既に使用されています"
        message_zh: "此魔法链接已被使用"
        description: "Returned when the magic link token has already been consumed to create a session."
        userAction: "Request a new magic link from the login page."

      email_not_found:
        code: AUTH.MAGIC_LINK.EMAIL_NOT_FOUND
        status: 404
        message: "No account found for this email address"
        message_ja: "このメールアドレスのアカウントが見つかりません"
        message_zh: "未找到此邮箱对应的账户"
        description: "Returned when a magic link is requested for an email that is not associated with any account."
        userAction: "Check the email address for typos, or register a new account."

  oidc:
    breadcrumb: "Auth > OIDC"
    errors:
      state_mismatch:
        code: AUTH.OIDC.STATE_MISMATCH
        status: 400
        message: "OIDC state parameter does not match"
        message_ja: "OIDC の state パラメータが一致しません"
        message_zh: "OIDC state 参数不匹配"
        description: "Returned when the state value returned by the identity provider does not match the one issued at the start of the flow, indicating possible CSRF."
        userAction: "Restart the sign-in flow from the login page."

      nonce_mismatch:
        code: AUTH.OIDC.NONCE_MISMATCH
        status: 400
        message: "OIDC nonce does not match"
        message_ja: "OIDC の nonce が一致しません"
        message_zh: "OIDC nonce 不匹配"
        description: "Returned when the nonce claim in the ID token does not match the one embedded in the authentication request."
        userAction: "Restart the sign-in flow from the login page."

      id_token_invalid:
        code: AUTH.OIDC.ID_TOKEN_INVALID
        status: 401
        message: "OIDC ID token is invalid"
        message_ja: "OIDC の ID トークンが無効です"
        message_zh: "OIDC ID 令牌无效"
        description: "Returned when the ID token fails verification (signature, issuer, audience, or expiration)."
        userAction: "Restart the sign-in flow, or contact support if the problem persists."

      provider_unreachable:
        code: AUTH.OIDC.PROVIDER_UNREACHABLE
        status: 502
        message: "OIDC provider is unreachable"
        message_ja: "OIDC プロバイダに接続できません"
        message_zh: "无法连接到 OIDC 服务提供商"
        description: "Returned when the configured OIDC provider cannot be contacted for discovery or token exchange."
        userAction: "Try again in a moment; contact your administrator if the problem persists."

      provider_rejected:
        code: AUTH.OIDC.PROVIDER_REJECTED
        status: 400
        message: "The identity provider declined the sign-in"
        message_ja: "ID プロバイダがサインインを拒否しました"
        message_zh: "身份提供方拒绝了此次登录"
        description: "Returned when the OIDC callback URL carries `error` / `error_description` query parameters, meaning the identity provider refused to issue an authorization code. Common causes include the user denying the consent screen, the relying-party application being misconfigured at the IdP, or the IdP rejecting the requested scopes."
        userAction: "Retry the sign-in flow and approve the consent screen, or contact your workspace administrator if the identity provider keeps rejecting the request."
        i18nKey: "auth.errors.oidc_provider_rejected"

      github_not_configured:
        code: AUTH.OIDC.GITHUB_NOT_CONFIGURED
        status: 503
        message: "GitHub login is not configured"
        message_ja: "GitHub ログインが設定されていません"
        message_zh: "GitHub 登录未配置"
        description: "Returned when the user attempts to sign in via GitHub but the instance has no GitHub OIDC client configured."
        userAction: "Ask the instance administrator to configure GitHub login credentials."

      microsoft_not_configured:
        code: AUTH.OIDC.MICROSOFT_NOT_CONFIGURED
        status: 503
        message: "Microsoft login is not configured"
        message_ja: "Microsoft ログインが設定されていません"
        message_zh: "Microsoft 登录未配置"
        description: "Returned when the user attempts to sign in via Microsoft but the instance has no Microsoft OIDC client configured."
        userAction: "Ask the instance administrator to configure Microsoft login credentials."

      email_not_verified:
        code: AUTH.OIDC.EMAIL_NOT_VERIFIED
        status: 403
        message: "Email address is not verified by the identity provider"
        message_ja: "ID プロバイダでメールアドレスが確認されていません"
        message_zh: "身份提供方尚未验证此邮箱地址"
        description: "Returned when the OIDC identity provider indicates the user's email address has not been verified."
        userAction: "Verify your email address with your identity provider, then try again."

  pat:
    breadcrumb: "Auth > Personal Access Token"
    errors:
      token_unknown:
        code: AUTH.PAT.TOKEN_UNKNOWN
        status: 401
        message: "Personal access token is invalid"
        message_ja: "パーソナルアクセストークンが無効です"
        message_zh: "个人访问令牌无效"
        description: "Returned when the supplied personal access token is unknown, malformed, or has been revoked."
        userAction: "Generate a new personal access token and update the client configuration."

      expired:
        code: AUTH.PAT.EXPIRED
        status: 401
        message: "Personal access token has expired"
        message_ja: "パーソナルアクセストークンの有効期限が切れました"
        message_zh: "个人访问令牌已过期"
        description: "Returned when the PAT's expiration timestamp has passed."
        userAction: "Create a new personal access token."

  avatar:
    breadcrumb: "Auth > Avatar"
    errors:
      upload_too_large:
        code: AUTH.AVATAR.UPLOAD_TOO_LARGE
        status: 413
        message: "The uploaded image is too large. Maximum size is 5 MB."
        message_ja: "画像サイズが大きすぎます。上限は 5 MB です。"
        message_zh: "上传的图片过大，最大支持 5 MB。"
        description: "Returned when the avatar upload request body exceeds the 5 MB size limit enforced by the server."
        userAction: "Choose a smaller image (under 5 MB) and try uploading again."

      upload_invalid_image:
        code: AUTH.AVATAR.UPLOAD_INVALID_IMAGE
        status: 400
        message: "The uploaded file is not a valid image."
        message_ja: "画像ファイルとして読み込めませんでした。"
        message_zh: "上传的文件不是有效的图片。"
        description: "Returned when the uploaded file cannot be decoded as an image, or its bytes do not match any supported image format."
        userAction: "Re-export the file as a valid JPEG, PNG, WebP, or GIF image and try again."

      upload_unsupported_type:
        code: AUTH.AVATAR.UPLOAD_UNSUPPORTED_TYPE
        status: 415
        message: "Unsupported image type. Use JPEG, PNG, WebP, or GIF."
        message_ja: "対応していない画像形式です。JPEG / PNG / WebP / GIF のいずれかを指定してください。"
        message_zh: "不支持的图片格式，请使用 JPEG、PNG、WebP 或 GIF。"
        description: "Returned when the uploaded avatar's MIME type is not one of the accepted values (image/jpeg, image/png, image/webp, image/gif)."
        userAction: "Convert the image to JPEG, PNG, WebP, or GIF and upload it again."

      not_found:
        code: AUTH.AVATAR.NOT_FOUND
        status: 404
        message: "Avatar not found."
        message_ja: "プロフィール画像が見つかりませんでした。"
        message_zh: "未找到头像。"
        description: "Returned by the avatar proxy endpoint when the target user does not exist or has no avatar stored."
        userAction: "Upload an avatar first, or verify that the user identifier is correct."

      storage_unavailable:
        code: AUTH.AVATAR.STORAGE_UNAVAILABLE
        status: 503
        message: "Avatar storage is temporarily unavailable. Please try again."
        message_ja: "プロフィール画像ストレージに一時的に接続できません。時間をおいて再度お試しください。"
        message_zh: "头像存储暂时不可用，请稍后重试。"
        description: "Returned when the avatar object store (S3 or MinIO) is unreachable or fails to read/write the avatar object."
        userAction: "Wait a moment and retry the request. If the problem persists, contact your instance administrator."
