domain: user
breadcrumb: "User"

resources:
  delete:
    breadcrumb: "User > Delete"
    errors:
      confirm_required:
        code: USER.DELETE.CONFIRM_REQUIRED
        status: 400
        message: "Confirmation required to delete this user. Resend with confirm=true."
        message_ja: "このユーザーを削除するには確認が必要です。confirm=true を付けて再送信してください。"
        message_zh: "删除此用户需要确认。请将 confirm=true 一并重新发送。"
        description: "Returned by `DELETE /admin/users/{userId}` when the request body is missing or has confirm=false. The endpoint immediately purges the user account including avatar storage objects and any task / calendar attachment blobs whose ref_count drops to zero, so the API requires explicit confirmation."
        userAction: "Resend the request with `{\"confirm\": true}` after acknowledging that the action is irreversible."
      self_not_allowed:
        code: USER.DELETE.SELF_NOT_ALLOWED
        status: 400
        message: "Instance admins cannot delete their own account."
        message_ja: "インスタンス管理者は自身のアカウントを削除できません。"
        message_zh: "实例管理员无法删除自己的账户。"
        description: "Returned by `DELETE /admin/users/{userId}` when the path id matches the calling actor. Self-delete is rejected to prevent an admin from locking themselves out of the panel; recovery would require another admin to reverse it."
        userAction: "Have a different instance admin delete the account, or transfer instance admin privileges first."
