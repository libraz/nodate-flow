domain: timebox
breadcrumb: "Timebox"

resources:
  timebox:
    breadcrumb: "Timebox"
    errors:
      not_found:
        code: TIMEBOX.TIMEBOX.NOT_FOUND
        status: 404
        message: "Timebox not found"
        message_ja: "タイムボックスが見つかりません"
        message_zh: "未找到时间盒"
        description: "Returned when a timebox with the given public_id does not exist or the actor has no visibility into it."
        userAction: "Verify the timebox ID, or refresh the list to see current timeboxes."

      name_taken:
        code: TIMEBOX.TIMEBOX.NAME_TAKEN
        status: 409
        message: "A timebox with this name already exists in the workspace"
        message_ja: "このワークスペースに同名のタイムボックスが既に存在します"
        message_zh: "工作区中已存在同名的时间盒"
        description: "Returned when the requested timebox name conflicts with an existing timebox in the same workspace."
        userAction: "Choose a different name."

      invalid_dates:
        code: TIMEBOX.TIMEBOX.INVALID_DATES
        status: 422
        message: "Timebox end date must be after start date"
        message_ja: "終了日は開始日より後にしてください"
        message_zh: "结束日期必须晚于开始日期"
        description: "Returned when ends_on is not strictly after starts_on."
        userAction: "Adjust the start or end date so that the end date comes after the start date."

      already_completed:
        code: TIMEBOX.TIMEBOX.ALREADY_COMPLETED
        status: 409
        message: "Cannot modify a completed timebox"
        message_ja: "完了済みのタイムボックスは変更できません"
        message_zh: "已完成的时间盒无法修改"
        description: "Returned when an update or state change is attempted on a timebox that has already been marked as completed."
        userAction: "Reopen the timebox before making changes, or create a new one."

  task:
    breadcrumb: "Timebox > Task"
    errors:
      not_found:
        code: TIMEBOX.TASK.NOT_FOUND
        status: 404
        message: "Task is not in this timebox"
        message_ja: "このタイムボックスにタスクがありません"
        message_zh: "该时间盒中没有此任务"
        description: "Returned when removing a task that is not a member of the timebox, or was already removed."
        userAction: "Refresh the timebox and try again."

      already_added:
        code: TIMEBOX.TASK.ALREADY_ADDED
        status: 409
        message: "Task is already in this timebox"
        message_ja: "このタスクは既にタイムボックスに追加されています"
        message_zh: "该任务已在此时间盒中"
        description: "Returned when the task has already been added to the target timebox."
        userAction: "No action needed; the task is already present in the timebox."
